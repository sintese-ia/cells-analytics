<script>
const D=__DATA__;
/* ========== formatação pt-BR ========== */
const nf=(v,d=2)=>v==null||!isFinite(v)?'—':v.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const R$=v=>v==null||!isFinite(v)?'—':'R$ '+nf(v,2), R0=v=>v==null||!isFinite(v)?'—':'R$ '+nf(v,0);
const IN=v=>v==null||!isFinite(v)?'—':Math.round(v).toLocaleString('pt-BR');
const PC=(v,d=1)=>v==null||!isFinite(v)?'—':nf(v,d)+'%', RT=v=>v==null||!isFinite(v)?'—':nf(v,2);
const DT=s=>{if(!s)return'—';const[a,b,c]=String(s).slice(0,10).split('-');return c+'/'+b+'/'+a};
const dv=(a,b)=>(b==null||b===0||!isFinite(b))?null:a/b;
const MS=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MSL=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

/* ========== categorias (§4) ========== */
const CAT={amostra:{n:'Amostra',cor:'#C9C9C4'},novo_avulso:{n:'Novos — compra única',cor:'#111111'},
 novo_assinatura:{n:'Novos — assinatura',cor:'#F45E1A'},antigo_avulso:{n:'Antigos — compra única',cor:'#5A5A57'},
 antigo_inicio_assinatura:{n:'Antigos — início de assinatura',cor:'#F79767'},
 recorrente:{n:'Assinantes recorrentes',cor:'#F7C9AC'}};
const ORD=['amostra','novo_avulso','novo_assinatura','antigo_avulso','antigo_inicio_assinatura','recorrente'];

// BALDES — a camada de negocio acima das 6 categorias tecnicas. Sao exclusivos e somam o
// faturamento total. COMPRAS e "A CONTA" (novos + recompra + novos assinantes), que e sobre o
// que ROAS e CAC sao calculados; amostra e MRR aparecem, mas FORA da conta. Ver
// cells-infra/camada-semantica.md. MRR e renovacao de assinante de mes anterior — por definicao
// nao tem campanha, entao a visao de midia declara isso em vez de mostrar tabela vazia.
const BALDE={
 amostra:{n:'Amostras', cats:['amostra'],
   d:'Pedido só de amostra. Entra no faturamento total, mas nunca no ROAS nem no CAC.'},
 compras:{n:'Compras',  cats:['novo_avulso','antigo_avulso','novo_assinatura','antigo_inicio_assinatura'],
   d:'A CONTA: novos + recompra + novos assinantes. É sobre ela que ROAS e CAC são calculados.'},
 mrr:{n:'MRR',          cats:['recorrente'],
   d:'Renovação de assinante de mês anterior. Não tem campanha — a mídia deste mês não a causou.'}
};
const balCats=b=>BALDE[b]?BALDE[b].cats:null;

// Objetivo DECLARADO por (dia, conjunto). Default 'venda' para quem nao foi classificado — o
// default nunca esconde nada. Ver cells-infra/fixes/2026-08-07-campanha-objetivo.sql.
const OBJ={}; (D.objetivo||[]).forEach(r=>{OBJ[String(r.dia).slice(0,10)+'|'+r.conjunto]=r.objetivo});
const objDe=(dia,conj)=>OBJ[String(dia).slice(0,10)+'|'+conj]||'venda';
// A visao de midia segue o balde. Em COMPRAS, conjunto cujo objetivo e amostra sai da tabela:
// o CAC dele nao e metrica valida — o CJ_kit_exp entregou 85 amostras e 2 clientes diretos, e
// aparecia com CAC de R$ 940 pintado de vermelho por uma conta que ele nunca tentou fazer.
// 'topo' NUNCA some: sumir com o gasto e pior que mostra-lo marcado.
const passaObj=(dia,conj)=>{ if(!S.bal||S.bal==='mrr')return true;
 const o=objDe(dia,conj);
 return S.bal==='amostra' ? o==='amostra' : o!=='amostra'; };
const avisoMRR=`<div class="al w"><b>MRR não tem campanha.</b> É renovação de assinante de mês
 anterior — a mídia deste mês não a causou, então não existe conjunto para atribuir. Veja o MRR
 em Resumo, Tipo de cliente ou Semanal.</div>`;
const avisoObj=b=>b==='amostra'
 ? `<div class="al o"><b>Só conjuntos com objetivo declarado de amostra.</b> Aqui a métrica que vale é
    <b>custo por amostra</b>, não CAC — esses conjuntos nunca tentaram comprar cliente direto.</div>`
 : b==='compras'
 ? `<div class="al o"><b>Conjuntos de amostra estão fora.</b> Sobram os de venda e os de topo de funil.
    Objetivo e vigência em <code>core.campanha_objetivo</code> — os W1 valem como amostra até 31/07 e
    como venda a partir de 01/08, quando a oferta trocou.</div>` : '';

// GASTO POR BALDE. Ate 08/08/2026 o filtro de balde cortava os PEDIDOS mas nao o GASTO: o painel
// mostrava "ROAS 0,39" no balde MRR — dividia renovacao de assinante de mes anterior pelo gasto
// de midia deste mes, que nao a causou. Mesmo defeito no balde Amostras, e em Compras ao contrario
// (o CAC da conta carregava R$ 10.570 de conjunto que nunca tentou comprar cliente).
// `vw_campanha_dia_real` fecha exatamente com o meta de `vw_mvp_custo_dia`: 61 dias, R$ 26.265,03
// dos dois lados, zero dia divergente — entao o split por objetivo e exato, nao rateio.
const SPEND_AM={}; (D.camp||[]).forEach(r=>{const d=String(r.dia).slice(0,10);
 if(objDe(d,r.conjunto)==='amostra') SPEND_AM[d]=(SPEND_AM[d]||0)+(+r.spend||0)});
// MRR devolve 0 para que dv() caia em null e a tela mostre "—". Zero e a resposta certa: nao e
// "gasto desconhecido", e gasto que por definicao nao existe.
// Conjunto de amostra so existe no meta; google_ads e whatsapp nao tem grao de conjunto.
function custoBalde(s){
 const c=+s.custo||0;
 if(S.bal==='mrr') return 0;
 const am = s.fonte==='meta' ? (SPEND_AM[s.dia]||0) : 0;
 if(S.bal==='amostra') return Math.min(am,c);
 if(S.bal==='compras') return Math.max(0,c-am);
 return c;
}
const avisoBalde=()=>S.bal==='mrr'
 ? `<div class="al w"><b>Gasto, ROAS, CPA e CAC aparecem como "—" neste balde.</b> MRR é renovação de
    assinante de mês anterior: a mídia deste mês não a causou, então não há gasto que dividir.
    Zero não é dado faltando — é a resposta certa.</div>`
 : S.bal==='amostra'
 ? `<div class="al o"><b>O gasto aqui é só o dos conjuntos com objetivo declarado de amostra.</b>
    A métrica que vale é <b>custo por amostra</b>, não CAC. Objetivo e vigência em
    <code>core.campanha_objetivo</code>.</div>`
 : S.bal==='compras'
 ? `<div class="al o"><b>O gasto de conjunto de amostra está fora.</b> Sobra o gasto de venda e de
    topo de funil — é sobre ele que o CAC da conta é calculado.</div>` : '';
// google_ads x google_organico: o utm_source nao separava (o sufixo `g` do feed do Merchant
// Center serve listagem gratuita E Shopping pago). Quem separa e o gclid. `google` fica no mapa
// por seguranca, para dado antigo nao cair em "Outros".
const GRUPO={meta:'Mídia paga',google:'Mídia paga',google_ads:'Mídia paga',tiktok:'Mídia paga',whatsapp:'Mídia paga',
 google_organico:'Orgânico',google_organic:'Orgânico',
 instagram:'Orgânico',direct:'Orgânico',email:'CRM',nutri:'Profissionais',evento:'Presencial',
 parceria:'Influência',ia:'Orgânico','woo-legado':'Outros','nao-atribuido':'Outros',crm:'CRM',youtube:'Orgânico',
 carta:'Outros',indicacao:'Influência',organico:'Orgânico'};
const dias=D.dias.map(r=>({...r,dia:String(r.dia).slice(0,10)}));
const spend=D.spend.map(r=>({...r,dia:String(r.dia).slice(0,10)}));
// MIN sai do dado, nao de constante: o banco comeca em 16/01/2025 e o painel estava cravado em
// 2026-01-01, entao o total de clientes nunca fechava (mostrava 624 onde o historico tem 1.206).
const MAX=dias.reduce((a,r)=>r.dia>a?r.dia:a,'2026-01-01');
const MIN=dias.reduce((a,r)=>r.dia<a?r.dia:a,'9999-12-31');

// ULTIMO DIA FECHADO — fronteira do coletor de gasto do Meta, que roda ~7h atras.
// O dia corrente entra com receita e SEM gasto: em 06/08/2026 foram 11 pedidos e R$ 716,91
// com R$ 0,00 de spend, o que deixava o CPA do grid 24% otimista e o CAC da Semanal 11% barato.
// Toda metrica de CUSTO (CPA, CAC, ROAS) termina aqui; receita pura pode ir ate MAX.
// NAO derivar de `spend` (vw_mvp_custo_dia): o custo mensal e rateado por dia e chega a lancar
// em dia futuro — em 06/08 havia WhatsApp ate 31/08. A fronteira honesta e o grid de midia.
const FECHADO=(D.grid||[]).reduce((a,r)=>{const d=String(r.dia).slice(0,10);
 return (+r.spend>0&&d>a)?d:a},'2026-01-01')||MAX;
const DIA_ABERTO=FECHADO<MAX;
// corta o fim de uma janela no ultimo dia fechado
const jf=j=>j?[j[0],(j[1]>FECHADO?FECHADO:j[1])]:j;
const avisoAberto=(o)=>DIA_ABERTO?`<div class="al w"><b>${DT(MAX)} ainda não fechou.</b>
 O coletor de gasto do Meta vai até ${DT(FECHADO)}, então ${MAX===FECHADO?'':`o dia ${DT(MAX)} tem pedido e não tem gasto`}.
 ${o||'As métricas de custo desta tela param em '+DT(FECHADO)+' — senão o CPA sai barato por falta de denominador.'}</div>`:'';
const CANAIS=[...new Set(dias.map(r=>r.canal))].filter(c=>c!=='woo-legado'||1).sort();

/* ========== estado ========== */
const S={pg:'resumo',gop:{},gcanal:'',gper:'7',gsp:1,gbusca:'',gord:'spend',per:'30',cmp:'prev',mod:'sintese',can:'',cat:'',bal:'',eixo:'pedido',rec:'liq',
 gran:'dia',ind:'liq',srt:{},oc:{},mais:false,d1:'',d2:''};
function addD(s,n){const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)}
function jan(){
 const f=MAX;
 switch(S.per){
  case 'hoje':return[f,f];
  case 'ontem':return[addD(f,-1),addD(f,-1)];
  case '7':return[addD(f,-6),f];
  case '30':return[addD(f,-29),f];
  case 'mes':return[f.slice(0,7)+'-01',f];
  case 'mesant':{const m=new Date(f.slice(0,7)+'-01T12:00:00');m.setMonth(m.getMonth()-1);
   const i=m.toISOString().slice(0,10);const l=new Date(m.getFullYear(),m.getMonth()+1,0);
   return[i,l.toISOString().slice(0,10)]}
  case 'ano':return[f.slice(0,4)+'-01-01',f];
  case 'tudo':return[MIN,f];
  case 'custom':return[S.d1||MIN,S.d2||f];
  default:return[addD(f,-29),f]}
}
function janC(j){
 const [i,f]=j, n=(new Date(f+'T12:00:00')-new Date(i+'T12:00:00'))/864e5+1;
 if(S.cmp==='none')return null;
 if(S.cmp==='mesant'){const a=new Date(i+'T12:00:00'),b=new Date(f+'T12:00:00');
  a.setMonth(a.getMonth()-1);b.setMonth(b.getMonth()-1);
  return[a.toISOString().slice(0,10),b.toISOString().slice(0,10)]}
 if(S.cmp==='anoant'){return[(+i.slice(0,4)-1)+i.slice(4),(+f.slice(0,4)-1)+f.slice(4)]}
 return[addD(i,-n),addD(i,-1)];
}
const inP=(x,j)=>j&&x>=j[0]&&x<=j[1];
const val=r=>S.rec==='liq'?r.liq:r.bruto;
const cCan=r=>S.eixo==='aquisicao'?r.canal_aq:r.canal;

/* ========== agregação ========== */
// `ks` e o conjunto de identidades do balde. `cli` deixa de ser soma de count(distinct) por grupo
// (que contava cinco vezes quem comprou em cinco dias: 1.053 contra 624 reais no ano de 2026) e
// passa a ser o tamanho da UNIAO. Fecha sozinho tambem Receita por cliente, que saia 41% baixa.
function Z(){const o={rec:0,bruto:0,desc:0,reemb:0,cmv:0,marg:0,ped:0,cli:0,cmv_ok:0,med:0,inf:0,spend:0,ks:new Set()};
 for(const c of ORD){o['r_'+c]=0;o['p_'+c]=0}return o}
// une os `ks` de uma lista de baldes e recalcula `cli`. Chamar sempre que somar baldes na mao.
function uneKS(destino,fontes){for(const f of fontes){if(f&&f.ks)for(const k of f.ks)destino.ks.add(k)}
 destino.cli=destino.ks.size;return destino}
function agg(j,{canalView=false}={}){
 const A=Object.assign(Z(),{plat_c:0,plat_r:0,can:{},cat:{}});
 if(!j)return A;
 for(const r of dias){
  if(!inP(r.dia,j))continue;
  const c=cCan(r);
  if(S.can&&c!==S.can)continue;
  if(S.gru&&(GRUPO[c]||'Outros')!==S.gru)continue;
  if(S.cat&&r.categoria!==S.cat)continue;
  if(S.bal&&!balCats(S.bal).includes(r.categoria))continue;
  // REGRA: na visão por canal (eixo=pedido) a recorrente NAO entra —
  // atribuir renovação a canal não faz sentido, o canal não causou a renovação.
  if(canalView&&S.eixo==='pedido'&&r.categoria==='recorrente')continue;
  const v=val(r);
  const o=A.can[c]||(A.can[c]=Object.assign(Z(),{canal:c}));
  const k=A.cat[r.categoria]||(A.cat[r.categoria]=Object.assign(Z(),{categoria:r.categoria}));
  for(const t of [A,o,k]){
   t.rec+=v;t.bruto+=r.bruto;t.desc+=r.desc_;t.reemb+=r.reemb;t.cmv+=r.cmv;t.marg+=r.marg;
   t.ped+=r.pedidos;t.cmv_ok+=r.cmv_ok;t.med+=r.med;t.inf+=r.inf;
   if(r.ks)for(const x of r.ks)t.ks.add(x);
   t['r_'+r.categoria]+=v;t['p_'+r.categoria]+=r.pedidos}
 }
 // cli = tamanho da uniao, nunca soma de contagens
 A.cli=A.ks.size;
 for(const o of Object.values(A.can))o.cli=o.ks.size;
 for(const k of Object.values(A.cat))k.cli=k.ks.size;
 for(const s of spend){
  if(!inP(s.dia,j))continue;
  if(S.can&&s.fonte!==S.can)continue;
  if(S.gru&&(GRUPO[s.fonte]||'Outros')!==S.gru)continue;
  const c=custoBalde(s); if(S.bal&&!c)continue;
  A.spend+=c;
  const o=A.can[s.fonte]||(A.can[s.fonte]=Object.assign(Z(),{canal:s.fonte}));o.spend+=c}
 for(const p of D.plat){const d=String(p.dia).slice(0,10);
  if(inP(d,j)){A.plat_c+=(+p.compras||0);A.plat_r+=(+p.receita||0)}}
 return A;
}
// diaMax: corta todo mes no mesmo dia. Serve para comparar o mes CORRENTE (incompleto) com o
// anterior sem mentir — comparar 30 dias contra 31 inventa queda. Ver MESPARC abaixo.
function serie(j,g,diaMax){
 const m={};
 const put=k=>m[k]||(m[k]=Object.assign({k},Z()));
 for(const r of dias){
  if(!inP(r.dia,j))continue;
  if(diaMax&&+r.dia.slice(8,10)>diaMax)continue;
  const c=cCan(r);
  if(S.can&&c!==S.can)continue; if(S.gru&&(GRUPO[c]||'Outros')!==S.gru)continue; if(S.cat&&r.categoria!==S.cat)continue;
  if(S.bal&&!balCats(S.bal).includes(r.categoria))continue;
  const k=g==='mes'?r.dia.slice(0,7):g==='sem'?semK(r.dia):r.dia, o=put(k), v=val(r);
  o.rec+=v;o.marg+=r.marg;o.ped+=r.pedidos;o['r_'+r.categoria]+=v;o['p_'+r.categoria]+=r.pedidos;
  if(r.ks)for(const x of r.ks)o.ks.add(x)}
 for(const o of Object.values(m))o.cli=o.ks.size;
 for(const s of spend){
  if(!inP(s.dia,j))continue; if(S.can&&s.fonte!==S.can)continue;
  if(S.gru&&(GRUPO[s.fonte]||'Outros')!==S.gru)continue;
  if(diaMax&&+s.dia.slice(8,10)>diaMax)continue;
  const c=custoBalde(s); if(S.bal&&!c)continue;
  const k=g==='mes'?s.dia.slice(0,7):g==='sem'?semK(s.dia):s.dia;put(k).spend+=c}
 return Object.values(m).sort((a,b)=>a.k<b.k?-1:1);
}

function dlt(a,b){ if(b==null||b===0||!isFinite(b)||a==null)return'';

 return `<span class="${c}">${s} ${nf(Math.abs(d),1)}%</span>`}

function pgSemanal(){
 const J=D.k7||[], SM=D.ksem||[], MS=D.kmes||[];

 // (coletor ~7h atras). Em 06/08/2026 isso dava CAC de R$ 411 onde a janela fechada dava R$ 461.
 // Manchete so com janela fechada; o dia em aberto aparece no aviso, nao no numero.
 const jFech=J.filter(x=>String(x.ate).slice(0,10)<=FECHADO);
 const j=jFech.length?jFech[jFech.length-1]:J[J.length-1];
 const mes=MS.filter(m=>m.fat_op_meta!=null).slice(-1)[0]||MS[MS.length-1]||{};
 const dl=(a,b)=>{if(a==null||b==null||!b)return'<span class="t3">—</span>';
   const p=100*a/b-100; return `<span style="color:${p>=0?'var(--ok)':'var(--er)'}">${p>=0?'▲':'▼'} ${PC(Math.abs(p))}</span>`};
 const dlInv=(a,b)=>{if(a==null||b==null||!b)return'<span class="t3">—</span>';
   const p=100*a/b-100; return `<span style="color:${p<=0?'var(--ok)':'var(--er)'}">${p>=0?'▲':'▼'} ${PC(Math.abs(p))}</span>`};
 const cd=(t,v,n)=>`<div class="cd"><div class="k">${t}</div><div class="v">${v}</div><div class="n">${n}</div></div>`;
 const pct=(a,b)=>(b&&b!==0)?100*a/b:null;

 const conta=`<div class="cds">
  ${cd('Faturamento da conta',R0(j.fat_op),`${dl(j.fat_op,j.fat_op_ant)} vs 7 dias antes · meta ${R0(j.fat_op_meta_ritmo)} (${PC(j.pct_op_ritmo)})`)}
  ${cd('ROAS da conta',RT(j.roas_op),`${dl(j.roas_op,j.roas_op_ant)} · meta ${RT(j.roas_op_meta)}`)}
  ${cd('CAC dos novos',R0(j.cac_novos),`${dlInv(j.cac_novos,j.cac_novos_ant)} · meta ${R0(j.cac_meta)}`)}
  ${cd('Investido',R0(j.custo_total),`${dl(j.custo_total,j.custo_total_ant)} · orçamento do ritmo ${R0(j.custo_meta_ritmo)}`)}
 </div>`;
 const blocos=`<div class="cds">
  ${cd('1 · Novos',R0(j.fat_novos),`${j.qtd_novos} clientes novos · meta ${RT(j.qtd_novos_meta_ritmo)}`)}
  ${cd('2 · Recompra (antigos)',R0(j.fat_recorrente),'cliente que já tinha comprado')}
  ${cd('3 · Novos assinantes',R0(j.novos_assinantes),'vira MRR no mês que vem')}
 </div>`;
 const fora=`<div class="cds">
  ${cd('Fora · Amostra',R0(j.amostra),`${j.qtd_amostras} amostras · não é venda que a mídia paga`)}
  ${cd('Fora · MRR',R0(j.mrr),'renovação de assinante de mês anterior')}
 </div>`;

 const linhasSem = SM.slice().reverse().slice(0,14).map(w=>{
   const semMeta=!w.dias_com_plano, parcial=w.dias_com_plano>0&&w.dias_com_plano<7;
   const meta = w.semana_parcial ? (w.fat_op_meta||0)*(w.dias_decorridos||0)/7 : w.fat_op_meta;
   const p = pct(w.fat_op, meta);
   const cor = w.acao==='PAUSA'?'var(--er)':w.acao==='ESCALA'?'var(--ok)':'var(--av)';
   return `<tr${w.semana_parcial?' class="sub"':''}>
     <td class="l">${DT(w.semana).slice(0,5)}–${DT(w.semana_fim).slice(0,5)}${w.semana_parcial?' <span class="t3">em curso</span>':''}</td>
     <td>${R0(w.fat_op)}</td><td>${semMeta?'—':R0(meta)+(parcial?` <span class="t3">(${w.dias_com_plano}d)</span>`:'')}</td>
     <td>${semMeta?'—':PC(p)}</td><td>${w.qtd_novos}</td><td>${R0(w.custo_total)}</td>
     <td>${R0(w.cac_novos_4s)}</td><td>${RT(w.roas_compras_liq_4s)}</td>
     <td style="color:${cor};font-weight:650">${w.acao}</td></tr>`}).join('');

 const qbr = [['1 · Novos','fat_novos','fat_novos_meta'],['2 · Recompra','fat_recorrente','fat_recorrente_meta'],
   ['3 · Novos assinantes','novos_assinantes','novos_assinantes_meta'],
   ['Total da conta','fat_op','fat_op_meta'],['Investimento','custo_total','custo_meta_plano'],
   ['Fora · Amostra','amostra','amostra_meta'],['Fora · MRR','mrr','mrr_meta']].map(([n,k,mk])=>{
   const real=mes[k],metaMes=mes[mk];
   const k2=(mes.dias_decorridos||0)/(mes.dias_do_mes||31);
   const metaHoje=metaMes!=null?metaMes*k2:null, p=pct(real,metaHoje);
   return `<tr${n.startsWith('Fora')?' class="sub"':''}><td class="l">${n}</td><td>${R0(real)}</td>
     <td>${R0(metaHoje)}</td><td>${p==null?'—':PC(p)}</td><td>${R0(metaMes)}</td>
     <td>${metaMes==null?'—':R0(metaMes-real)}</td></tr>`}).join('');

 return `${avisoAberto('A conta abaixo fecha em '+DT(FECHADO)+' — a janela que inclui hoje ainda não tem o gasto do dia.')}
 <div class="sc"><div class="sch"><div><h2>A conta — 7 dias, ${DT(j.de).slice(0,5)} a ${DT(j.ate).slice(0,5)}</h2>
  <p>Janela móvel: sempre 7 dias dos dois lados, sem o viés da semana pela metade. A conta é
  <b>novos + recompra + novos assinantes</b>; amostra e MRR ficam fora do ROAS e do CAC.</p></div></div>
  ${conta}</div>
 <div class="sc"><div class="sch"><div><h2>Composição da conta</h2></div></div>${blocos}</div>
 <div class="sc"><div class="sch"><div><h2>Fora da conta</h2>
  <p>Aparecem, mas não entram no ROAS nem no CAC.</p></div></div>${fora}</div>
 <div class="sc"><div class="sch"><div><h2>Semana a semana</h2>
  <p>A ação lê a janela de 4 semanas, nunca a semana isolada.</p></div></div>
  <div class="tw"><table><thead><tr><th class="l">Semana</th><th>Conta</th><th>Meta</th><th>%</th>
   <th>Novos</th><th>Investido</th><th>CAC 4s</th><th>ROAS 4s</th><th>Ação</th></tr></thead>
   <tbody>${linhasSem||'<tr><td colspan="9" class="l">Sem semanas no período.</td></tr>'}</tbody></table></div></div>
 <div class="sc"><div class="sch"><div><h2>Quebra da meta — ${mes.mes?DT(mes.mes).slice(3):''}</h2>
  <p>“Deveria estar” = meta do mês × dias decorridos. O MRR não se comporta assim: 7 das 13
  cobranças do clube caem no dia 30/31, então ele sobe de uma vez no fim do mês.</p></div></div>
  <div class="tw"><table><thead><tr><th class="l">Linha</th><th>Realizado</th><th>Deveria estar</th>
   <th>Ritmo</th><th>Meta do mês</th><th>Falta</th></tr></thead><tbody>${qbr}</tbody></table></div></div>`;
}

/* ==================== MÍDIA — canal > campanha > conjunto > anúncio ==================== */
function pgMidia(){
 const R=D.grid||[];
 if(!R.length) return `<div class="emp">Sem dado de mídia. Confira <code>core.vw_ads_metricas_dia</code>.</div>`;
 // maxd para no ultimo dia FECHADO: o dia corrente chega com pedido e sem gasto (o coletor do
 // Meta esta ~7h atras) e derrubava o CPA do grid de R$ 78,60 para R$ 59,50 — 24% otimista.
 const dias=+S.gper||7, maxd=FECHADO;
 const lim=new Date(maxd+'T12:00:00'); lim.setDate(lim.getDate()-(dias-1));
 const de=lim.toISOString().slice(0,10);
 // As tres ultimas vem da tela Campanhas, que foi fundida aqui: amostra e assinante nao existem
 // no grid. Elas tem grao de CONJUNTO (nao de anuncio), entao so somam ate esse nivel.
 const KS=['spend','impressoes','ob_clicks','plat_lpv','plat_atc','plat_checkout','plat_compras',
   'pedidos','nc_pedidos','receita','nc_receita','conta','margem','nc_margem',
   'amostras','assin_novo','nc_estrito'];
 const Z0=()=>Object.fromEntries(KS.map(k=>[k,0]));
 const som=(d,r)=>{KS.forEach(k=>d[k]+=(+r[k]||0));return d};
 const raiz=new Map(); const q=(S.gbusca||'').toLowerCase();
 for(const r of R){
   if(r.dia<de||r.dia>maxd) continue;
   if(!passaObj(r.dia,r.conjunto)) continue;
   if(q && ![r.campanha,r.conjunto,r.anuncio].some(x=>String(x||'').toLowerCase().includes(q))) continue;
   const n1=raiz.get(r.canal)||{n:r.canal,lv:1,a:Z0(),f:new Map()}; raiz.set(r.canal,n1); som(n1.a,r);
   const n2=n1.f.get(r.campanha)||{n:r.campanha,lv:2,a:Z0(),f:new Map()}; n1.f.set(r.campanha,n2); som(n2.a,r);
   const n3=n2.f.get(r.conjunto)||{n:r.conjunto,lv:3,a:Z0(),f:new Map()}; n2.f.set(r.conjunto,n3); som(n3.a,r);
   const n4=n3.f.get(r.anuncio)||{n:r.anuncio,lv:4,a:Z0(),f:null,ni:r.nao_identificado}; n3.f.set(r.anuncio,n4); som(n4.a,r);
 }
 // Amostras, novos assinantes e o "NC estrito" vem de core.vw_campanha_dia_real, com grao de
 // conjunto. Somam so ate o nivel 3 — no anuncio ficam em branco de proposito, porque atribuir
 // amostra a criativo individual nao tem base. Nao passam por `som` do grid para nao duplicar.
 for(const r of (D.camp||[])){
   const d=String(r.dia||'').slice(0,10);
   if(d<de||d>maxd) continue;
   if(!passaObj(d,r.conjunto)) continue;
   if(q && ![r.campanha,r.conjunto].some(x=>String(x||'').toLowerCase().includes(q))) continue;
   const add=o=>{o.amostras+=(+r.ped_amostra||0);o.assin_novo+=(+r.assin_novo||0);o.nc_estrito+=(+r.ped_aquisicao||0)};
   const n1=raiz.get('meta')||{n:'meta',lv:1,a:Z0(),f:new Map()}; raiz.set('meta',n1); add(n1.a);
   const n2=n1.f.get(r.campanha)||{n:r.campanha,lv:2,a:Z0(),f:new Map()}; n1.f.set(r.campanha,n2); add(n2.a);
   const n3=n2.f.get(r.conjunto)||{n:r.conjunto,lv:3,a:Z0(),f:new Map()}; n2.f.set(r.conjunto,n3); add(n3.a);
 }
 // metrica de CUSTO nao existe sem spend: 0/n daria 0 e pintaria de verde um CPA inexistente
 const cst=(sp,n)=>(!sp||!n)?null:sp/n, dv=(a,b)=>(b&&b!==0)?a/b:null;
 const COLS=[
  {k:'spend',t:'Spend',f:a=>R0(a.spend),v:a=>a.spend},
  {k:'pedidos',t:'Purchases',f:a=>nf(a.pedidos,0),v:a=>a.pedidos},
  {k:'cpa',t:'CPA',f:a=>R0(cst(a.spend,a.pedidos)),v:a=>cst(a.spend,a.pedidos)},
  {k:'aov',t:'AOV',f:a=>R0(dv(a.receita,a.pedidos)),v:a=>dv(a.receita,a.pedidos)},
  {k:'conta',t:'Conta',f:a=>R0(a.conta),v:a=>a.conta},
  {k:'roas',t:'ROAS',f:a=>RT(a.spend?dv(a.conta,a.spend):null),v:a=>a.spend?dv(a.conta,a.spend):null,c:'roas'},
  {k:'ncp',t:'NCP',f:a=>nf(a.nc_pedidos,0),v:a=>a.nc_pedidos},
  {k:'nccpa',t:'NC CPA',f:a=>R0(cst(a.spend,a.nc_pedidos)),v:a=>cst(a.spend,a.nc_pedidos),c:'cac'},
  {k:'ncroas',t:'NC ROAS',f:a=>RT(a.spend?dv(a.nc_receita,a.spend):null),v:a=>a.spend?dv(a.nc_receita,a.spend):null},
  {k:'ncpp',t:'NC PP',f:a=>R0(dv(a.nc_margem,a.nc_pedidos)),v:a=>dv(a.nc_margem,a.nc_pedidos)},
  {k:'cr',t:'CR',f:a=>PC(dv(100*a.pedidos,a.plat_lpv),2),v:a=>dv(100*a.pedidos,a.plat_lpv),p:1},
  {k:'atc',t:'ATC',f:a=>nf(a.plat_atc,0),v:a=>a.plat_atc,p:1},
  {k:'catc',t:'Cost ATC',f:a=>R0(cst(a.spend,a.plat_atc)),v:a=>cst(a.spend,a.plat_atc),p:1},
  {k:'ck',t:'Start Checkout',f:a=>nf(a.plat_checkout,0),v:a=>a.plat_checkout,p:1},
  {k:'uv',t:'Unique Visitors',f:a=>nf(a.plat_lpv,0),v:a=>a.plat_lpv,p:1},
  {k:'cpv',t:'CPV',f:a=>R$(cst(a.spend,a.plat_lpv)),v:a=>cst(a.spend,a.plat_lpv),p:1},
  {k:'obc',t:'OB Clicks',f:a=>nf(a.ob_clicks,0),v:a=>a.ob_clicks,p:1},
  {k:'obctr',t:'OB CTR',f:a=>PC(dv(100*a.ob_clicks,a.impressoes),2),v:a=>dv(100*a.ob_clicks,a.impressoes),p:1},
  // vindas da tela Campanhas — grao de conjunto, em branco no nivel de anuncio
  {k:'am',t:'Samples',ce:1,f:a=>a.amostras?nf(a.amostras,0):'<span class="na">—</span>',v:a=>a.amostras},
  {k:'cam',t:'Cost/Sample',ce:1,f:a=>R0(cst(a.spend,a.amostras)),v:a=>cst(a.spend,a.amostras)},
  {k:'asn',t:'New Subs',ce:1,f:a=>a.assin_novo?nf(a.assin_novo,0):'<span class="na">—</span>',v:a=>a.assin_novo},
  {k:'nce',t:'NCP estrito',ce:1,
   tip:'Cliente novo contado so quando o modelo tambem atribuiu a AQUISICAO ao Meta. A coluna NCP ao lado credita a campanha que esta na UTM do pedido. Em 30 dias sao 47 contra 28 — CAC de R$ 381 contra R$ 640. Nao e bug, e first click contra last click.',
   f:a=>a.nc_estrito?nf(a.nc_estrito,0):'<span class="na">—</span>',v:a=>a.nc_estrito},
  {k:'cace',t:'CAC estrito',ce:1,f:a=>R0(cst(a.spend,a.nc_estrito)),v:a=>cst(a.spend,a.nc_estrito),c:'cac'}];
 const col=COLS.find(c=>c.k===S.gord)||COLS[0];
 const ord=l=>l.sort((x,y)=>{const a=col.v(x.a),b=col.v(y.a);
   if(a==null&&b==null)return 0; if(a==null)return 1; if(b==null)return -1; return b-a});
 const cor=(c,v)=>{if(v==null||!c.c)return'';
   if(c.c==='roas')return v<1?'var(--er)':v>2?'var(--ok)':'var(--av)';
   return v>250?'var(--er)':v<180?'var(--ok)':'var(--av)'};
 const out=[];
 const linha=(no,cam)=>{
   const tem=no.f&&no.f.size>0, ab=!!S.gop[cam];
   const tds=COLS.map(c=>{const v=c.v(no.a),k=cor(c,v);
     return `<td class="${c.p?'t3':''}" ${k?`style="color:${k}"`:''}>${c.f(no.a)}</td>`}).join('');
   out.push(`<tr class="${no.lv>2?'sub':''}"><td class="l fx" style="padding-left:${4+(no.lv-(S.gcanal?2:1))*16}px">`
    +(tem?`<span data-gtog="${encodeURIComponent(cam)}" style="cursor:pointer;color:var(--t3);display:inline-block;width:13px">${ab?'▾':'▸'}</span>`:'<span style="display:inline-block;width:13px"></span>')
    +`${no.n}</td>${tds}</tr>`);
   if(tem&&ab) ord([...no.f.values()]).forEach(f=>linha(f,cam+'›'+f.n));
 };
 // Canal e SELETOR no topo (padrao Triple Whale), nao linha da tabela: com um canal escolhido a
 // tabela ja comeca em campanha e economiza um clique em toda leitura.
 let lst;
 if(S.gcanal){ const c=raiz.get(S.gcanal); lst = c?ord([...c.f.values()]):[]; }
 else lst = ord([...raiz.values()]);
 for(const n of lst){ if(S.gsp&&!n.a.spend) continue; linha(n,n.n); }
 const tot=Z0(); lst.forEach(n=>som(tot,n.a));
 out.push(`<tr class="tot"><td class="l fx">TOTAL</td>${COLS.map(c=>`<td>${c.f(tot)}</td>`).join('')}</tr>`);
 const th=COLS.map(c=>`<th data-gord="${c.k}" class="${c.p?'t3':''}" style="cursor:pointer">${c.t}${S.gord===c.k?' ↓':''}</th>`).join('');
 const per=[['7','7 dias'],['14','14 dias'],['30','30 dias'],['60','60 dias']]
   .map(([v,t])=>`<button data-gper="${v}" class="${String(S.gper)===v?'on':''}">${t}</button>`).join('');
 const canais=[...raiz.keys()].sort();
 const selCanal=`<select data-gcanal class="sel"><option value="">Todos os canais</option>`
   +canais.map(c=>`<option value="${c}" ${S.gcanal===c?'selected':''}>${c}</option>`).join('')+`</select>`;
 if(S.bal==='mrr') return avisoMRR;
 return `${avisoAberto('O grid vai até '+DT(FECHADO)+'.')}${avisoObj(S.bal)}
 <div class="sc"><div class="sch"><div><h2>Grid de mídia</h2>
  <p>Abre <b>canal → campanha → conjunto → anúncio</b>. Colunas em cinza são reportadas pelo
  Meta (pixel da plataforma); as demais são pedido real medido no banco.</p></div>
  <div class="sg">${selCanal}${per}</div></div>
  <div class="tw"><table><thead><tr><th class="l fx">Campanha</th>${th}</tr></thead>
   <tbody>${out.join('')}</tbody></table></div></div>
 <div class="sc"><p class="t3" style="font-size:12px;line-height:1.6">
  <b>Receita por anúncio</b> vem do <code>utm_term</code>, que casa com o nome do anúncio no Meta
  em ~78% do spend. O que não casa aparece como <b>(não identificado)</b> dentro do conjunto, com
  spend zero — nunca colado em outro criativo.<br>
  <b>Unique Visitors, CPV e CR</b> usam o <code>landing_page_view</code> do Meta: é visita
  reportada pela plataforma, só de tráfego Meta — não é sessão de site.</p></div>`;
}

function pgResumo(){
 const j=jan(),jc=janC(j),A=agg(j),B=jc?agg(jc):null;
 const g=S.gran, s=serie(j,g), sm=serie([MIN,MAX],'mes');
 const sp=k=>s.map(d=>{const A2={...Z(),...d};return M[k]?M[k].g(A2)||0:0});
 // No balde Amostras o slot do ROAS vira Custo por amostra — a métrica que o balde realmente tem.
 const r1=(S.bal==='amostra'?['rec','spend','camos','ped','cli','tm']:['rec','spend','roas','ped','cli','tm'])
  .map(k=>CD(k,A,B,['rec','spend','ped'].includes(k)?sp(k):null)).join('');
 const r2=['nov','cacn','rnov','ncroas','nassin','cacа','txassin'].map(k=>CD(k,A,B)).join('');
 const r3=['antc','antia','renov','rrec','pcrec','txant'].map(k=>CD(k,A,B)).join('');
 // preview de atribuição — top 5, SEM recorrente (regra do canal)
 const Ac=agg(j,{canalView:true});
 const top=Object.values(Ac.can).filter(c=>c.rec>0||c.spend>0).sort((a,b)=>b.rec-a.rec).slice(0,5);
 const tp=TB([
  {k:'c',t:'Canal',l:1,fx:1,f:r=>r.canal,raw:r=>r.canal,tf:()=>'Top 5'},
  {k:'r',t:'Faturamento',f:r=>R0(r.rec),raw:r=>r.rec,tf:t=>R0(t.rec)},
  {k:'g',t:'Gasto',f:r=>r.spend>0?R0(r.spend):'<span class="na">sem dado</span>',raw:r=>r.spend,tf:t=>R0(t.spend)},
  {k:'ro',t:roasVale()?'ROAS':'Custo/amostra',
   f:r=>{const v=roasVale()?dv(r.rec,r.spend):dv(r.spend,r.p_amostra);
     return v==null?'<span class="na">—</span>':(roasVale()?RT(v):R$(v))},
   raw:r=>(roasVale()?dv(r.rec,r.spend):dv(r.spend,r.p_amostra))??-1},
  {k:'n',t:'Novos',f:r=>IN(r.p_novo_avulso+r.p_novo_assinatura),raw:r=>r.p_novo_avulso+r.p_novo_assinatura},
  {k:'na',t:'Novos assin.',ce:1,f:r=>IN(r.p_novo_assinatura+r.p_antigo_inicio_assinatura),raw:r=>r.p_novo_assinatura+r.p_antigo_inicio_assinatura}
 ],top,top.reduce((a,r)=>{a.rec=(a.rec||0)+r.rec;a.spend=(a.spend||0)+r.spend;return a},{}));
 // saúde da assinatura
 const jr={}; D.jor.forEach(x=>jr[x.e]={n:+x.n,v:+x.v});
 const novasAssin=A.p_novo_assinatura+A.p_antigo_inicio_assinatura;
 const liq=novasAssin-(jr.cancel?0:0);
 const sa=`<div class="gr g6">
  <div class="cd"><div class="k">Novas assinaturas</div><div class="v">${IN(novasAssin)}</div><div class="c f">no período</div></div>
  <div class="cd"><div class="k">Renovações</div><div class="v">${IN(A.p_recorrente)}</div><div class="c f">${R0(A.r_recorrente)}</div></div>
  <div class="cd"><div class="k">Cancelamentos</div><div class="v">${IN(jr.cancel?.n)}</div><div class="c f">histórico total</div></div>
  <div class="cd"><div class="k">Receita recorrente</div><div class="v">${R0(A.r_recorrente)}</div><div class="c f">${PC(dv(A.r_recorrente,A.rec)*100)} do total</div></div>
  <div class="cd"><div class="k">Churn</div><div class="v na" style="font-size:15px">sem fonte</div><div class="c f">API do Appstle bloqueada</div></div></div>
  <div class="al w">Cancelamento e pausa de assinatura <b>não têm fonte confiável</b> — a API do Appstle está bloqueada pelo plano. O número de cancelamento acima vem de <code>cancelled_at</code> da Shopify, que cobre só parte do ciclo.</div>`;
 // alertas derivados
 const al=[];
 const semG=Object.values(Ac.can).filter(c=>c.rec>800&&c.spend===0&&!['direct','nao-atribuido','woo-legado','instagram','email','ia'].includes(c.canal));
 if(semG.length)al.push(['c',`<b>${semG.map(c=>c.canal).join(' e ')}</b> gerou ${R0(semG.reduce((a,c)=>a+c.rec,0))} com <b>gasto zero registrado</b>. ROAS, CPA e CAC desses canais são indeterminados — não bons.`]);
 if(B){const c1=M.cacn.g(A),c0=M.cacn.g(B);
  if(c1&&c0)al.push([c1>c0*1.1?'w':'o',`O CAC de novo cliente ${c1>c0?'aumentou':'caiu'} <b>${PC(Math.abs((c1-c0)/c0*100))}</b>, de ${R$(c0)} para ${R$(c1)}.`])}
 const pr=dv(A.r_recorrente,A.rec)*100;
 if(pr)al.push([pr>=35?'o':'w',`A participação da receita recorrente está em <b>${PC(pr)}</b> do faturamento.`]);
 const cans=Object.values(Ac.can).filter(c=>c.p_novo_avulso+c.p_novo_assinatura>=5)
  .map(c=>({c:c.canal,n:c.p_novo_avulso+c.p_novo_assinatura,tx:dv(c.p_novo_assinatura,c.p_novo_avulso+c.p_novo_assinatura)}))
  .filter(x=>x.tx!=null).sort((a,b)=>b.tx-a.tx);
 if(cans.length>=2){const mais=Object.values(Ac.can).sort((a,b)=>(b.p_novo_avulso+b.p_novo_assinatura)-(a.p_novo_avulso+a.p_novo_assinatura))[0];
  al.push(['o',`<b>${mais.canal}</b> trouxe mais clientes novos (${IN(mais.p_novo_avulso+mais.p_novo_assinatura)}), mas <b>${cans[0].c}</b> tem a maior taxa de assinatura direta (${PC(cans[0].tx*100)}).`])}
 const mpr=M.mpr.g(A);
 if(mpr!=null)al.push([mpr>=1?'o':'w',`Cada real gasto devolveu <b>${RT(mpr)}</b> de margem de contribuição. ${mpr>=1?'O período se paga na primeira compra.':'O retorno depende do valor acumulado — veja Cohorts.'}`]);
 // PAYBACK NO RESUMO. Fica em Cohorts com detalhe, mas e o numero que decide escalar midia:
 // enterrado numa aba interna ninguem ve. Consolida so os cohorts que TEM custo registrado.
 (()=>{const pb=(D.payback||[]).filter(r=>r.cac_aprox!=null&&+r.cac_aprox>0);
  if(!pb.length)return;
  const sp=pb.reduce((a,r)=>a+ +r.spend,0), cl=pb.reduce((a,r)=>a+ +r.clientes,0);
  const mg=pb.reduce((a,r)=>a+(+r.margem_180_por_cliente||0)*(+r.clientes),0);
  const rz=dv(mg,sp); if(rz==null)return;
  const canais=[...new Set(pb.map(r=>r.canal))];
  al.push([rz>=1?'o':'c',`<b>Payback em 180 dias: ${rz.toFixed(2).replace('.',',')}x.</b>
   ${R0(sp)} de mídia (${canais.join(', ')}) trouxeram ${IN(cl)} clientes pagantes, que devolveram
   ${R$(dv(mg,cl))} de margem por cliente contra um CAC de ${R$(dv(sp,cl))}.
   ${rz<1?`<b>Não se paga</b> — e o LTV não cresce depois: quem passou de 180 dias tem em média 1,67 pedidos e 1,5 mês de vida. Detalhe por cohort em Cohorts.`:'Detalhe por cohort em Cohorts.'}`])})();
 if(A.inf>0)al.push(['w',`<b>${IN(A.inf)}</b> pedidos têm origem <b>inferida</b> (herdada da aquisição), não medida. Contam em faturamento, mas nunca em ROAS de aquisição.`]);
 const sh=D.saude.map(p=>`<div class="al ${p.status==='OK'?'o':p.status==='ATRASADO'?'w':'c'}"><div><b>${p.fonte}</b> <span class="pl g">${p.tipo}</span><br><span style="color:var(--t2)">${p.status} · idade ${nf(+p.idade_horas,1)}h · SLA ${p.sla_horas}h · ${IN(+p.linhas)} linhas</span></div></div>`).join('');
 return `${avisoBalde()}<div class="sc"><div class="gr g6">${r1}</div></div>
 <div class="sc"><div class="sch"><div><h2>Aquisição</h2><p>Amostra <b>entra</b> no faturamento total, mas <b>não</b> conta como novo cliente nem no CAC — não é aquisição.</p></div></div><div class="gr g6">${r2}</div></div>
 <div class="sc"><div class="sch"><div><h2>Base e recorrência</h2></div></div><div class="gr g6">${r3}</div></div>
 <div class="sc"><div class="sch"><div><h2>Faturamento, gasto e ROAS</h2></div>
  <div class="chk">${['dia','sem','mes'].map(x=>`<button data-gran="${x}" class="${g===x?'on':''}">${x==='dia'?'Diário':x==='sem'?'Semanal':'Mensal'}</button>`).join('')}</div></div>
  <div class="pn"><div class="pnb">${chartRSR(s)}</div></div></div>
 <div class="sc"><div class="sch"><div><h2>Composição do faturamento</h2><p>As seis categorias empilhadas por mês. <b>Amostra entra no faturamento</b> — é receita real que entrou — mas nunca conta como novo cliente nem entra no CAC.</p></div></div>
  <div class="pn"><div class="pnb">${chartStack(sm,ORD)}</div></div></div>
 <div class="sc"><div class="sch"><div><h2>Atribuição — top 5 canais</h2><p>Sem receita recorrente: atribuir renovação a canal não faz sentido.</p></div>
  <button class="bt" data-go="atribuicao">Ver tudo →</button></div><div class="pn">${tp.html}</div></div>
 <div class="sc"><div class="sch"><div><h2>Saúde da assinatura</h2></div></div>${sa}</div>
 <div class="sc"><div class="sch"><div><h2>Insights e alertas</h2><p>Derivados do dado do período, não texto fixo.</p></div></div>${al.map(([t,x])=>`<div class="al ${t}">${x}</div>`).join('')}</div>
 <div class="sc"><div class="sch"><div><h2>Saúde do dado</h2><p>Um painel que não mostra os próprios buracos mente com mais autoridade que uma planilha.</p></div></div>${sh}</div>`;
}

   raw:r=>(roasVale()?dv(r.rec,r.spend):dv(r.spend,r.p_amostra))??-1,

  {k:'tm',t:'Ticket médio',f:r=>R$(dv(r.rec,r.ped)),raw:r=>dv(r.rec,r.ped)??0,tf:t=>R$(dv(t.rec,t.ped))},
  {k:'n',t:'Novos clientes',f:r=>IN(r.p_novo_avulso+r.p_novo_assinatura),raw:r=>r.p_novo_avulso+r.p_novo_assinatura,tf:t=>IN(t.p_novo_avulso+t.p_novo_assinatura)},
  {k:'rn',t:'Receita de novos',f:r=>R0(r.r_novo_avulso+r.r_novo_assinatura),raw:r=>r.r_novo_avulso+r.r_novo_assinatura,tf:t=>R0(t.r_novo_avulso+t.r_novo_assinatura)},
  {k:'cn',t:'CAC NC',f:r=>R$(dv(r.spend,r.p_novo_avulso+r.p_novo_assinatura)),raw:r=>dv(r.spend,r.p_novo_avulso+r.p_novo_assinatura)??1e9,tf:t=>R$(dv(t.spend,t.p_novo_avulso+t.p_novo_assinatura))},
  {k:'ncr',t:'NC-ROAS',f:r=>{const v=dv(r.r_novo_avulso+r.r_novo_assinatura,r.spend);return v==null?'<span class="na">—</span>':RT(v)},raw:r=>dv(r.r_novo_avulso+r.r_novo_assinatura,r.spend)??-1,tf:t=>RT(dv(t.r_novo_avulso+t.r_novo_assinatura,t.spend))},
  {k:'na',t:'Novos assinantes',ce:1,f:r=>IN(r.p_novo_assinatura+r.p_antigo_inicio_assinatura),raw:r=>r.p_novo_assinatura+r.p_antigo_inicio_assinatura,tf:t=>IN(t.p_novo_assinatura+t.p_antigo_inicio_assinatura)},
  {k:'ca',t:'CAC assinante',ce:1,f:r=>R$(dv(r.spend,r.p_novo_assinatura+r.p_antigo_inicio_assinatura)),raw:r=>dv(r.spend,r.p_novo_assinatura+r.p_antigo_inicio_assinatura)??1e9,tf:t=>R$(dv(t.spend,t.p_novo_assinatura+t.p_antigo_inicio_assinatura))},
  {k:'tx',t:'% novos que assinam',ce:1,f:r=>PC(dv(r.p_novo_assinatura,r.p_novo_avulso+r.p_novo_assinatura)*100),raw:r=>dv(r.p_novo_assinatura,r.p_novo_avulso+r.p_novo_assinatura)??-1,tf:t=>PC(dv(t.p_novo_assinatura,t.p_novo_avulso+t.p_novo_assinatura)*100)},
  {k:'ant',t:'Antigos',f:r=>IN(r.p_antigo_avulso+r.p_antigo_inicio_assinatura),raw:r=>r.p_antigo_avulso+r.p_antigo_inicio_assinatura,tf:t=>IN(t.p_antigo_avulso+t.p_antigo_inicio_assinatura)},
  {k:'aia',t:'Antigos → assinatura',ce:1,f:r=>IN(r.p_antigo_inicio_assinatura),raw:r=>r.p_antigo_inicio_assinatura,tf:t=>IN(t.p_antigo_inicio_assinatura)},

 ];
 if(S.eixo==='aquisicao'){cols.splice(5,0,
  {k:'rr',t:'Receita recorrente',ce:1,tip:'Renovação atribuída ao canal que ADQUIRIU o cliente. É visão de valor acumulado, não de performance.',f:r=>R0(r.r_recorrente),raw:r=>r.r_recorrente,tf:t=>R0(t.r_recorrente)},
  {k:'rv',t:'Renovações',ce:1,f:r=>IN(r.p_recorrente),raw:r=>r.p_recorrente,tf:t=>IN(t.p_recorrente)})}
 const T=TB(cols,rows,tot,true);
 const avPlat=S.mod==='plataforma'?`<div class="al w"><b>Modelo Plataforma.</b> Os valores atribuídos pelas plataformas podem conter sobreposição e não devem ser somados como faturamento real. No período o Meta se atribui <b>${R0(A.plat_r)}</b> e <b>${IN(A.plat_c)}</b> compras — nosso modelo Síntese vê ${R0(A.can.meta?.rec||0)} no canal.</div>`:'';
 const avEixo=S.eixo==='aquisicao'
  ?`<div class="al o"><b>Eixo: canal de aquisição.</b> A receita recorrente está incluída e atribuída ao canal que <b>originalmente adquiriu</b> o cliente. Leia como <b>valor acumulado</b>, não como performance de mídia do período.</div>`
  :`<div class="al o"><b>Eixo: canal do pedido.</b> A receita recorrente está <b>excluída</b> — atribuir renovação a canal não faz sentido, o canal não causou a renovação. Para ver renovação por origem, troque o eixo para <b>canal de aquisição</b>.</div>`;
 return `${avisoBalde()}<div class="sc"><div class="gr g6">${(S.bal==='amostra'
   ?['rec','spend','camos','ped','tm','nov','cacn','nassin','cacа']
   :['rec','spend','roas','cpa','ped','tm','nov','cacn','nassin','cacа']).map(k=>CD(k,A,B)).join('')}</div></div>
 ${avPlat}${avEixo}
 <div class="sc"><div class="sch"><div><h2>Atribuição por canal</h2>
  <p>Clique na linha para aprofundar. Clique no cabeçalho para ordenar. Colunas em laranja são exclusivas da Cells.</p></div>

  <div class="pn"><div class="pnh"><h3>Colunas</h3>${colToggle(cols)}</div>${T.html}</div></div>`;
}

function pgTipoCliente(){
 const j=jan(),jc=janC(j),A=agg(j),B=jc?agg(jc):null;
 const cel=(c,B2)=>{const o=A.cat[c]||Z(), ob=B2?(B2.cat[c]||Z()):null;
  return {cat:c,...o,_ant:ob}};
 const mk=(nome,cats,sub,tot)=>{
  // idem: quem é novo em janeiro e recorrente em março não são dois clientes
  const o=Z(); cats.forEach(c=>{const x=A.cat[c]||Z();for(const k in o)if(typeof x[k]==='number')o[k]+=x[k]});
  uneKS(o,cats.map(c=>A.cat[c]).filter(Boolean));
  const ob=B?(()=>{const z=Z();cats.forEach(c=>{const x=B.cat[c]||Z();for(const k in z)if(typeof x[k]==='number')z[k]+=x[k]});
   return uneKS(z,cats.map(c=>B.cat[c]).filter(Boolean))})():null;
  return {nome,...o,_ant:ob,_sub:sub,_tot:tot,_cats:cats}};
 const rows=[
  mk('Amostra',['amostra']),
  mk('Novos clientes',['novo_avulso','novo_assinatura']),
  mk('Compra única',['novo_avulso'],1), mk('Assinatura',['novo_assinatura'],1),
  mk('Clientes antigos',['antigo_avulso','antigo_inicio_assinatura']),
  mk('Compra única',['antigo_avulso'],1), mk('Início de assinatura',['antigo_inicio_assinatura'],1),
  mk('Assinantes recorrentes',['recorrente']),
  mk('Total',ORD,0,1)
 ];
 const totRec=A.rec||1;
 const T=TB([
  {k:'n',t:'Categoria',l:1,fx:1,f:r=>r.nome,raw:r=>r.nome},
  {k:'r',t:'Faturamento',f:r=>R0(r.rec),raw:r=>r.rec},
  {k:'pc',t:'% do faturamento',f:r=>PC(r.rec/totRec*100),raw:r=>r.rec/totRec},

  {k:'p',t:'Compras',f:r=>IN(r.ped),raw:r=>r.ped},
  {k:'cl',t:'Clientes',f:r=>IN(r.cli),raw:r=>r.cli},
  {k:'tm',t:'Ticket médio',f:r=>R$(dv(r.rec,r.ped)),raw:r=>dv(r.rec,r.ped)??0},
  {k:'m',t:'Margem',f:r=>R0(r.marg),raw:r=>r.marg},
  {k:'ro',t:'ROAS',tip:'Para assinantes recorrentes o ROAS corrente não é métrica válida — o gasto do mês não gerou a renovação.',
   f:r=>{if(r._cats&&r._cats.length===1&&r._cats[0]==='recorrente')return '<span class="na">n/a</span>';
    const v=dv(r.rec,A.spend);return v==null?'<span class="na">—</span>':RT(v)},raw:r=>r.rec}
 ],rows,null);
 // bloco de recorrentes
 const rc=A.cat.recorrente||Z();
 const blocoRec=`<div class="gr g6">
  <div class="cd"><div class="k">Assinantes que renovaram</div><div class="v">${IN(rc.cli)}</div></div>
  <div class="cd"><div class="k">Renovações</div><div class="v">${IN(rc.ped)}</div></div>
  <div class="cd"><div class="k">Receita recorrente</div><div class="v">${R0(rc.rec)}</div></div>
  <div class="cd"><div class="k">Ticket recorrente</div><div class="v">${R$(dv(rc.rec,rc.ped))}</div></div>
  <div class="cd"><div class="k">Margem recorrente</div><div class="v">${R0(rc.marg)}</div></div></div>`;
 // conversões
 const nv=A.p_novo_avulso+A.p_novo_assinatura, ant=A.p_antigo_avulso+A.p_antigo_inicio_assinatura;
 const cv=[
  ['Novos que assinam ÷ novos clientes',dv(A.p_novo_assinatura,nv)],
  ['Antigos que iniciam assinatura ÷ antigos compradores',dv(A.p_antigo_inicio_assinatura,ant)],
  ['Receita de antigos ÷ receita total',dv(A.r_antigo_avulso+A.r_antigo_inicio_assinatura,A.rec)],
  ['Receita recorrente ÷ receita total',dv(A.r_recorrente,A.rec)],
  ['Compra única que depois virou assinatura (histórico)',dv(+((D.jor.find(x=>x.e==='p1_para_assin')||{}).n||0),+((D.jor.find(x=>x.e==='p1_avulsa')||{}).n||1))]
 ];
 return `<div class="sc"><div class="gr g6">${['nov','nassin','antc','antia','renov','rrec'].map(k=>CD(k,A,B)).join('')}</div></div>
 <div class="sc"><div class="sch"><div><h2>Composição do faturamento por tipo de cliente</h2></div></div>

 <div class="sc"><div class="sch"><div><h2>Categorias</h2><p>Mutuamente exclusivas: um pedido cai em uma e só uma. Renovação nunca é contada como nova assinatura.</p></div></div>

 <div class="sc"><div class="sch"><div><h2>Conversões</h2></div></div>

function pgMensal(){
 const sm=serie([MIN,MAX],'mes');
 const ind=S.ind, m=M[ind]||M.rec;
 const mx=Math.max(...sm.map(d=>{const A={...Z(),...d};return m.g(A)||0}))||1;
 // "melhor mes" so pode sair de mes FECHADO — senao o mes em curso ganha ou perde por acidente
 const mxFechado=Math.max(...sm.filter(d=>d.k!==MESPARC).map(d=>{const A={...Z(),...d};return m.g(A)||0}),0);
 const bars=sm.map((d,i)=>{const A={...Z(),...d},v=m.g(A)||0,w=100/sm.length;
  const parcial=d.k===MESPARC, best=!parcial&&v===mxFechado&&v>0;
  return `<g><rect x="${i*w+w*.16}%" y="${100-v/mx*100}%" width="${w*.68}%" height="${v/mx*100}%"
   fill="${best?'var(--lj)':'var(--pt)'}" ${parcial?'opacity=".42"':''}><title>${MSL[+d.k.slice(5,7)-1]}: ${m.f(v)}${parcial?` — PARCIAL, só até o dia ${DIACORTE}`:''}</title></rect></g>`}).join('');
 // média móvel 3 meses
 const vals=sm.map(d=>{const A={...Z(),...d};return m.g(A)||0});
 const mm=vals.map((_,i)=>i<2?null:(vals[i]+vals[i-1]+vals[i-2])/3);
 const lp=mm.map((v,i)=>v==null?null:`${(i+0.5)*100/sm.length},${100-v/mx*100}`).filter(Boolean).join(' ');
 const CATL=[['Total',ORD],['Amostra',['amostra']],['Novos clientes',['novo_avulso','novo_assinatura']],
  ['— Compra única',['novo_avulso']],['— Assinatura',['novo_assinatura']],
  ['Clientes antigos',['antigo_avulso','antigo_inicio_assinatura']],
  ['— Compra única',['antigo_avulso']],['— Início de assinatura',['antigo_inicio_assinatura']],
  ['Assinantes recorrentes',['recorrente']]];
 const meses=sm.map(d=>d.k);
 // mesma serie, mas com todo mes cortado no dia de hoje — base da comparacao honesta
 const smC=MESPARC?serie([MIN,MAX],'mes',DIACORTE):[];
 const piv=CATL.map(([nome,cats])=>{
  const o={nome,_sub:nome.startsWith('—'),_tot:nome==='Total'};
  let tt=0;
  meses.forEach(mk2=>{const d=sm.find(x=>x.k===mk2)||{};
   const v=cats.reduce((a,c)=>a+((d['r_'+c])||0),0); o[mk2]=v; tt+=v;
   const dc=smC.find(x=>x.k===mk2); if(dc)o['_c'+mk2]=cats.reduce((a,c)=>a+((dc['r_'+c])||0),0)});
  o.total=tt; return o});
 const mxCell=Math.max(...piv.filter(p=>!p._tot).flatMap(p=>meses.map(mk2=>p[mk2])));

 el.querySelectorAll('[data-gcanal]').forEach(b=>b.onchange=()=>{S.gcanal=b.value;S.gop={};render()});
 const fi=el.querySelector('#fi'); if(fi)fi.onchange=()=>{S.ind=fi.value;render()};
 const dq=el.querySelector('#dq'); if(dq)dq.oninput=()=>{const v=dq.value.toLowerCase();
  el.querySelectorAll('#dl .df').forEach(d=>d.style.display=d.dataset.q.includes(v)?'':'none')};
 const bq=el.querySelector('#bq'); if(bq){bq.oninput=()=>{const v=bq.value.toLowerCase();
  el.querySelectorAll('tbody tr').forEach(tr=>{const t=tr.querySelector('td.fx');
   tr.style.display=(!t||t.textContent.toLowerCase().includes(v))?'':'none'})}}
 if(S.pg==='atribuicao')el.querySelectorAll('tbody tr.ck').forEach(tr=>{
  const c=tr.querySelector('td.fx'); if(!c)return;
  const nome=c.textContent.trim().split('\n')[0].trim();
  const ab=()=>drawer(nome); tr.onclick=ab; tr.onkeydown=e=>{if(e.key==='Enter')ab()}});
}
function drawer(canal){
 const j=jan(), A=agg(j,{canalView:true}), c=A.can[canal];
 if(!c){return}
 const meses=[...new Set(serie(j,'mes').map(s=>s.k))];
 const ads=D.adsets.filter(a=>meses.includes(a.mes)&&+a.spend>0).sort((a,b)=>b.spend-a.spend).slice(0,8);
 const cb=D.cbase.filter(x=>x.canal===canal), cli=cb.reduce((a,x)=>a+x.cli,0);
 const hv=D.heat.filter(x=>x.canal===canal);
 const rec=hv.reduce((a,x)=>a+ +x.rec,0);
 const st=serie(j,'mes');
 const rr=Object.values(agg(j).can)[0];
 // receita recorrente originada por este canal de aquisição
 const orig=dias.filter(r=>inP(r.dia,j)&&r.canal_aq===canal&&r.categoria==='recorrente')
  .reduce((a,r)=>a+val(r),0);
 document.getElementById('dwt').textContent=canal;
 document.getElementById('db').innerHTML=`
  <dl class="kv">
   <dt>Faturamento</dt><dd>${R$(c.rec)}</dd>
   <dt>Gasto</dt><dd>${c.spend>0?R$(c.spend):'<span class="na">sem dado</span>'}</dd>
   <dt>ROAS</dt><dd>${RT(dv(c.rec,c.spend))}</dd>
   <dt>Margem de contribuição</dt><dd>${R$(c.marg)}</dd>
   <dt>Margem por real gasto</dt><dd>${RT(dv(c.marg,c.spend))}</dd>
   <dt>Compras</dt><dd>${IN(c.ped)}</dd>
   <dt>Clientes únicos</dt><dd>${IN(c.cli)}</dd>
   <dt>Ticket médio</dt><dd>${R$(dv(c.rec,c.ped))}</dd>
  </dl>
  <h4 style="font-size:12.5px;margin:0 0 6px">Composição de clientes</h4>
  <dl class="kv">
   <dt>Novos — compra única</dt><dd>${IN(c.p_novo_avulso)} · ${R$(c.r_novo_avulso)}</dd>
   <dt style="color:var(--lj)">Novos — assinatura</dt><dd>${IN(c.p_novo_assinatura)} · ${R$(c.r_novo_assinatura)}</dd>
   <dt>Antigos — compra única</dt><dd>${IN(c.p_antigo_avulso)} · ${R$(c.r_antigo_avulso)}</dd>
   <dt style="color:var(--lj)">Antigos — início de assinatura</dt><dd>${IN(c.p_antigo_inicio_assinatura)} · ${R$(c.r_antigo_inicio_assinatura)}</dd>
   <dt>CAC de novo assinante</dt><dd>${R$(dv(c.spend,c.p_novo_assinatura+c.p_antigo_inicio_assinatura))}</dd>
   <dt>Receita recorrente originada</dt><dd>${R$(orig)}</dd>
  </dl>
  ${cli?`<h4 style="font-size:12.5px;margin:14px 0 6px">Cohorts deste canal</h4>
  <dl class="kv"><dt>Clientes adquiridos (histórico)</dt><dd>${IN(cli)}</dd>
   <dt>Receita acumulada</dt><dd>${R$(rec)}</dd>
   <dt>Receita por cliente</dt><dd>${R$(dv(rec,cli))}</dd>
   <dt>Idade média do cohort</dt><dd>${IN(cb.reduce((a,x)=>a+ +x.idade*x.cli,0)/cli)}d</dd></dl>`:''}
  ${st.length>1?`<h4 style="font-size:12.5px;margin:14px 0 6px">Evolução no período</h4>
   <dl class="kv">${st.map(x=>`<dt>${MS[+x.k.slice(5,7)-1]}</dt><dd>${R0(x.rec)}</dd>`).join('')}</dl>`:''}
  ${canal==='meta'&&ads.length?`<h4 style="font-size:12.5px;margin:14px 0 6px">Conjuntos de anúncio</h4>
   <dl class="kv">${ads.map(a=>`<dt>${a.adset}</dt><dd>${R0(+a.spend)} · ${RT(dv(+a.marg,+a.spend))}×</dd>`).join('')}</dl>`:''}`;
 document.getElementById('ov').classList.add('on');
 document.getElementById('dw').classList.add('on');
 document.getElementById('dx').focus();
}
const fech=()=>{document.getElementById('ov').classList.remove('on');document.getElementById('dw').classList.remove('on')};
/* ==================== eventos globais ==================== */
document.getElementById('nv').onclick=e=>{const b=e.target.closest('button[data-p]');
 if(b){S.pg=b.dataset.p;url();render();if(innerWidth<900)document.getElementById('sb').classList.remove('mb')}};
document.getElementById('tg').onclick=()=>document.getElementById('sb').classList.toggle(innerWidth<900?'mb':'col');
document.getElementById('flz').addEventListener('change',e=>{
 const m={fp:'per',fc:'cmp',fm:'mod',fch:'can',fe:'eixo',d1:'d1',d2:'d2'};
 if(m[e.target.id]){S[m[e.target.id]]=e.target.value;url();render()}});
document.getElementById('flx').addEventListener('change',e=>{
 const m={fcat:'cat',fgr:'gru',frec:'rec'};
 if(m[e.target.id]){S[m[e.target.id]]=e.target.value;url();render()}});
document.getElementById('flz').addEventListener('click',e=>{
 if(e.target.dataset&&e.target.dataset.bal!==undefined){S.bal=e.target.dataset.bal;S.cat='';url();render();return}
 if(e.target.id==='bm'){S.mais=!S.mais;render()}
 if(e.target.id==='bc'){Object.assign(S,{per:'30',cmp:'prev',mod:'sintese',can:'',cat:'',bal:'',gru:'',eixo:'pedido',rec:'liq',d1:'',d2:''});url();render()}
 if(e.target.id==='br'){render()}
 if(e.target.id==='be'){
  if(!CSV.length)return;
  const csv=CSV.map(r=>r.map(v=>{const s=v==null?'':String(v);
   return /[";\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(';')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}));
  a.download=`cells-analytics-${S.pg}-${MAX}.csv`; a.click(); URL.revokeObjectURL(a.href)}});
document.getElementById('ov').onclick=fech;
document.getElementById('dx').onclick=fech;
addEventListener('keydown',e=>{if(e.key==='Escape')fech()});
function url(){const p=new URLSearchParams();
 for(const k of ['pg','per','cmp','mod','can','cat','bal','gru','eixo','rec','d1','d2'])if(S[k])p.set(k,S[k]);
 history.replaceState(null,'','?'+p)}
(function init(){
 const p=new URLSearchParams(location.search);
 for(const k of ['pg','per','cmp','mod','can','cat','bal','gru','eixo','rec','d1','d2'])if(p.get(k))S[k]=p.get(k);
 if(!PGS[S.pg])S.pg='resumo';
 try{const c=localStorage.getItem('ca_cols'); if(c)S.oc=JSON.parse(c)}catch(e){}
 render();
})();
</script>
