<title>Cells Analytics</title>
<style>
:root{--pt:#111111;--br:#FFFFFF;--lj:#F45E1A;--fd:#F7F7F5;--ln:#E3E3DF;--ln2:#EFEFEC;
 --t2:#5A5A57;--t3:#8A8A86;--vd:#127A45;--vdb:#E8F4ED;--vm:#B3261E;--vmb:#FBEBE9;
 --ljb:#FEF0E9;--ljb2:#FDE8DD;--azb:#EDF3F9;--sb:236px}
*{box-sizing:border-box}
body{margin:0;background:var(--fd);color:var(--pt);font-size:13.5px;line-height:1.5;
 font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible,th:focus-visible{outline:2px solid var(--lj);outline-offset:1px}
.app{display:flex;min-height:100vh}
.sb{width:var(--sb);flex:none;background:var(--pt);color:#EDEDEA;position:sticky;top:0;height:100vh;
 display:flex;flex-direction:column;transition:width .16s}
.sb.col{width:58px}
.sbt{padding:19px 17px 13px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.lg{font-weight:800;font-size:18px;letter-spacing:-.03em;white-space:nowrap}
.lg em{color:var(--lj);font-style:normal}
.sb.col .lg span{display:none}
.bg{width:25px;height:25px;border-radius:4px;color:#96968F;display:grid;place-items:center;flex:none}
.bg:hover{background:#242422;color:#fff}
nav{padding:5px 7px;display:flex;flex-direction:column;gap:1px;flex:1;overflow-y:auto}
nav button{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:5px;color:#A5A5A0;
 font-size:13px;font-weight:500;text-align:left;width:100%}
nav button:hover{background:#1E1E1C;color:#fff}
nav button.on{background:#252523;color:#fff;font-weight:650;box-shadow:inset 2px 0 0 var(--lj)}
nav .ic{width:16px;flex:none;opacity:.9}
.sb.col nav .lb{display:none}
.sbf{padding:12px 15px;border-top:1px solid #242422;font-size:10.5px;color:#6C6C68;line-height:1.5}
.sb.col .sbf{display:none}
.mn{flex:1;min-width:0;display:flex;flex-direction:column}
.tp{background:var(--br);border-bottom:1px solid var(--ln);padding:11px 20px;position:sticky;top:0;z-index:30}
.tp1{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.tp h1{font-size:18px;font-weight:700;letter-spacing:-.02em;margin:0}
.up{font-size:11px;color:var(--t3)}
.bd2{background:var(--ljb);color:#A33F0E;font-size:10px;font-weight:700;padding:3px 7px;border-radius:3px;letter-spacing:.03em}
.fl{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.fg{display:flex;align-items:center;gap:5px}
.fg label{font-size:10px;color:var(--t3);font-weight:650;letter-spacing:.04em;text-transform:uppercase}
select,input[type=date]{border:1px solid var(--ln);background:var(--br);border-radius:4px;padding:4px 7px;font-size:12px;font-weight:500;color:var(--pt)}
.bt{border:1px solid var(--ln);background:var(--br);border-radius:4px;padding:4px 10px;font-size:12px;font-weight:600}
.bt:hover{background:#FAFAF8;border-color:#C9C9C4}
.bt.p{background:var(--pt);color:#fff;border-color:var(--pt)}.bt.p:hover{background:#242422}
.bt.on{background:var(--ljb);border-color:var(--lj);color:#A33F0E}
.bdy{padding:20px;flex:1}
.gr{display:grid;gap:10px;margin-bottom:10px}
.g6{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.cd{background:var(--br);border:1px solid var(--ln);border-radius:5px;padding:13px 14px}
.cd .k{font-size:10.5px;color:var(--t3);font-weight:650;letter-spacing:.03em;text-transform:uppercase}
.cd .v{font-size:23px;font-weight:700;letter-spacing:-.025em;margin:6px 0 3px;line-height:1.05;font-variant-numeric:tabular-nums}
.cd .c{font-size:11px;color:var(--t2);display:flex;gap:5px;flex-wrap:wrap;align-items:baseline}
.u{color:var(--vd);font-weight:700}.d{color:var(--vm);font-weight:700}.f{color:var(--t3);font-weight:600}
.sp{margin-top:7px;display:block;width:100%;height:24px}
.h{border-bottom:1px dotted var(--t3);cursor:help}
.sc{margin-bottom:20px}
.sch{display:flex;align-items:baseline;justify-content:space-between;gap:11px;margin-bottom:8px;flex-wrap:wrap}
.sch h2{font-size:14.5px;font-weight:700;margin:0;letter-spacing:-.01em}
.sch p{font-size:12px;color:var(--t2);margin:2px 0 0;max-width:88ch}
.pn{background:var(--br);border:1px solid var(--ln);border-radius:5px;overflow:hidden}
.pnh{padding:10px 14px;border-bottom:1px solid var(--ln);display:flex;align-items:center;justify-content:space-between;gap:9px;flex-wrap:wrap}
.pnh h3{font-size:12.5px;font-weight:650;margin:0}
.pnb{padding:14px}
/* só horizontal: o max-height criava scroll interno de 600px que sequestrava a roda do mouse
   (Jornada/Config ficavam com o fim da página inacessível) */
.tw{overflow-x:auto}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}
th{position:sticky;top:0;z-index:2;background:var(--br);text-align:right;padding:8px 9px;font-size:10px;
 font-weight:700;color:var(--t3);letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;
 border-bottom:1px solid var(--ln);cursor:pointer;user-select:none}
th:hover{color:var(--pt)}
th.l,td.l{text-align:left}
th.fx,td.fx{position:sticky;left:0;z-index:3;background:var(--br)}th.fx{z-index:4}
th.ce{background:var(--ljb2)}td.ce{background:var(--ljb)}
td{padding:7px 9px;text-align:right;border-bottom:1px solid var(--ln2);white-space:nowrap;font-variant-numeric:tabular-nums}
td.l{font-weight:600}
tbody tr:hover td{background:#FBFBF9}tbody tr:hover td.fx{background:#FBFBF9}tbody tr:hover td.ce{background:#FCE3D5}
tbody tr.ck{cursor:pointer}
tbody tr.sub td.fx{padding-left:26px;font-weight:500;color:var(--t2)}
tbody tr.tot td{font-weight:700;background:#F4F4F1}
tfoot td{position:sticky;bottom:0;background:#F4F4F1;font-weight:700;border-top:1.5px solid var(--ln);border-bottom:none}
tfoot td.fx{background:#F4F4F1}
.na{color:var(--t3)}
.pl{display:inline-block;font-size:9.5px;font-weight:700;padding:2px 5px;border-radius:3px;letter-spacing:.03em}
.pl.m{background:var(--vdb);color:var(--vd)}.pl.i{background:var(--ljb);color:#A33F0E}
.pl.g{background:#EFEFEC;color:var(--t2)}.pl.r{background:var(--vmb);color:var(--vm)}
.br2{height:4px;background:var(--ln2);border-radius:2px;overflow:hidden;min-width:38px;display:inline-block;vertical-align:middle}
.br2 i{display:block;height:100%;background:var(--lj)}
.cht{width:100%;height:230px;display:block}
.lgd{display:flex;gap:13px;flex-wrap:wrap;font-size:11px;color:var(--t2);margin-top:8px}
.lgd i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:4px}
/* display:block, nunca flex — com flex cada <b>/<code> solto vira coluna e a nota embaralha (bug do frete no Resultado) */
.al{display:block;padding:10px 12px;border-radius:4px;font-size:12px;border:1px solid var(--ln);background:var(--br);margin-bottom:7px}
.al.c{border-left:3px solid var(--vm);background:var(--vmb)}
.al.w{border-left:3px solid var(--lj);background:var(--ljb)}

.ov{position:fixed;inset:0;background:rgba(17,17,17,.32);z-index:50;display:none}.ov.on{display:block}
.dw{position:fixed;top:0;right:0;bottom:0;width:min(580px,95vw);background:var(--br);z-index:51;
 transform:translateX(100%);transition:transform .2s;overflow-y:auto;box-shadow:-8px 0 24px rgba(0,0,0,.11)}
.dw.on{transform:translateX(0)}
.dwh{padding:15px 18px;border-bottom:1px solid var(--ln);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--br);z-index:2}
.dwh h3{margin:0;font-size:15px;font-weight:700}
.dwb{padding:18px}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 13px;font-size:12.5px;margin-bottom:16px}
.kv dt{color:var(--t2)}.kv dd{margin:0;font-weight:650;font-variant-numeric:tabular-nums}
.hm td{text-align:center;font-size:11px;padding:6px 4px;border:1px solid var(--br)}
.hm td.fx{text-align:left;font-weight:650}
.fn{display:flex;flex-direction:column;gap:5px}
.fnr{display:flex;align-items:center;gap:10px}
.fnb{height:32px;background:var(--pt);border-radius:3px;display:flex;align-items:center;padding:0 9px;
 color:#fff;font-size:11.5px;font-weight:650;min-width:52px;white-space:nowrap}
.fnb.lj{background:var(--lj)}.fnb.g{background:#C9C9C4;color:var(--pt)}
.fnl{font-size:12px;color:var(--t2)}
.df{background:var(--br);border:1px solid var(--ln);border-radius:5px;padding:13px 15px;margin-bottom:8px}
.df h4{margin:0 0 4px;font-size:13px;font-weight:700}
.df .fx2{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;background:#F4F4F1;padding:5px 8px;border-radius:3px;display:inline-block;margin:3px 0;color:var(--t2)}
.df p{margin:3px 0 0;font-size:12px;color:var(--t2)}
input[type=search]{border:1px solid var(--ln);border-radius:4px;padding:6px 9px;font-size:12.5px;width:240px}
.sk{background:linear-gradient(90deg,#EFEFEC 25%,#F7F7F5 50%,#EFEFEC 75%);background-size:200% 100%;animation:sh 1.3s infinite;border-radius:4px;height:13px}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.emp{padding:32px;text-align:center;color:var(--t3);font-size:12.5px}
.chk{display:flex;flex-wrap:wrap;gap:5px}
.chk button{font-size:11px;padding:3px 8px;border:1px solid var(--ln);border-radius:3px;font-weight:600;color:var(--t2)}
.chk button.on{background:var(--pt);color:#fff;border-color:var(--pt)}
@media(max-width:900px){.sb{position:fixed;z-index:60;transform:translateX(-100%)}.sb.mb{transform:translateX(0)}.bdy{padding:13px}.tp{padding:10px 13px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
 <aside class="sb" id="sb">
  <div class="sbt"><div class="lg">c<em>e</em>lls<span> analytics</span></div>
   <button class="bg" id="tg" aria-label="Recolher menu"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button></div>
  <nav id="nv" role="navigation"></nav>
  <div class="sbf" id="ft"></div>
 </aside>
 <div class="mn">
  <div class="tp">
   <div class="tp1"><h1 id="pt">Visão geral</h1><span class="up" id="up"></span><span class="bd2" id="bd">DADO REAL · snapshot</span></div>
   <div class="fl" id="flz"></div>
   <div class="fl" id="flx" style="margin-top:7px;display:none"></div>
  </div>
  <div class="bdy" id="pg"></div>
 </div>
</div>
<div class="ov" id="ov"></div>
<aside class="dw" id="dw" role="dialog" aria-modal="true" aria-labelledby="dwt">
 <div class="dwh"><h3 id="dwt">—</h3><button class="bt" id="dx">Fechar</button></div>
 <div class="dwb" id="db"></div>
</aside>
<script>
const D=__DATA__;
/* ========== formatação pt-BR ========== */
const nf=(v,d=2)=>v==null||!isFinite(v)?'—':v.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const R$=v=>v==null||!isFinite(v)?'—':'R$ '+nf(v,2), R0=v=>v==null||!isFinite(v)?'—':'R$ '+nf(v,0);
const IN=v=>v==null||!isFinite(v)?'—':Math.round(v).toLocaleString('pt-BR');
const PC=(v,d=1)=>v==null||!isFinite(v)?'—':nf(v,d)+'%', RT=v=>v==null||!isFinite(v)?'—':nf(v,2);
const DT=s=>{if(!s)return'—';const[a,b,c]=String(s).slice(0,10).split('-');return c+'/'+b+'/'+a};
const dv=(a,b)=>(b==null||b===0||!isFinite(b))?null:a/b;
const MS=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const MSL=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

/* ========== categorias (§4) ========== */
const CAT={amostra:{n:'Amostra',cor:'#C9C9C4'},novo_avulso:{n:'Novos — compra única',cor:'#111111'},
 novo_assinatura:{n:'Novos — assinatura',cor:'#F45E1A'},antigo_avulso:{n:'Antigos — compra única',cor:'#5A5A57'},
 antigo_inicio_assinatura:{n:'Antigos — início de assinatura',cor:'#F79767'},
 recorrente:{n:'Assinantes recorrentes',cor:'#F7C9AC'}};
const ORD=['amostra','novo_avulso','novo_assinatura','antigo_avulso','antigo_inicio_assinatura','recorrente'];

// BALDES — a camada de negocio acima das 6 categorias tecnicas. Sao exclusivos e somam o
// faturamento total. COMPRAS e "A CONTA" (novos + recompra + novos assinantes), que e sobre o
// que ROAS e CAC sao calculados; amostra e MRR aparecem, mas FORA da conta. Ver
// cells-infra/camada-semantica.md. MRR e renovacao de assinante de mes anterior — por definicao
// nao tem campanha, entao a visao de midia declara isso em vez de mostrar tabela vazia.
const BALDE={
 amostra:{n:'Amostras', cats:['amostra'],
   d:'Pedido só de amostra. Entra no faturamento total, mas nunca no ROAS nem no CAC.'},
 compras:{n:'Compras',  cats:['novo_avulso','antigo_avulso','novo_assinatura','antigo_inicio_assinatura'],
   d:'A CONTA: novos + recompra + novos assinantes. É sobre ela que ROAS e CAC são calculados.'},
 mrr:{n:'MRR',          cats:['recorrente'],
   d:'Renovação de assinante de mês anterior. Não tem campanha — a mídia deste mês não a causou.'}
};
// Devolve null para balde vazio OU desconhecido. Quem chama TEM que checar o null antes do
// .includes — `S.bal` vem da URL e um valor invalido derrubava a pagina inteira (5 telas).
const balCats=b=>BALDE[b]?BALDE[b].cats:null;

const avisoMRR=`<div class="al w"><b>MRR não tem campanha.</b> É renovação de assinante de mês
 anterior — a mídia deste mês não a causou, então não existe conjunto para atribuir. Veja o MRR
 em Resumo, Tipo de cliente ou Semanal.</div>`;

// GASTO NAO SE DIVIDE POR BALDE. Tentei dividir em 08/08/2026, por objetivo declarado do conjunto,
// e a premissa era falsa: o MESMO conjunto entrega amostra E compra com um orcamento so. Em julho
// o W1_ENERGETICO fez 11 amostras, 5 compras de aquisicao e 2 assinaturas novas; o CJ_ADV_GERAL
// fez 4 e 3. Nenhum rotulo por conjunto descreve isso, e ratear o gasto pelo que saiu e circular.
//
// Pior: dividir quebrava o acordo com a camada semantica. `vw_kpi_mes` calcula a conta como
// fat_op / custo TOTAL — julho deu ROAS 0,78 e CAC R$ 345,90. O split fazia o Resumo mostrar
// 1,73 e R$ 155,08 nos mesmos dias: dois CACs para o mesmo mes, no mesmo painel.
//
// Regra: o gasto pertence a CONTA. Compras usa o gasto inteiro e bate com a Semanal. Amostras e
// MRR nao tem denominador proprio — devolvem 0 para que dv() caia em null e a tela mostre "—".
// Custo por amostra nao e metrica de balde, e metrica de CONJUNTO: fica no grid de Canais e
// campanhas, onde CJ_kit_exp aparece a R$ 24 e W1_ENERGETICO mostra as duas contas lado a lado.
function custoBalde(s){
 if(S.bal==='mrr'||S.bal==='amostra') return 0;
 return +s.custo||0;
}
const avisoBalde=()=>S.bal==='mrr'
 ? `<div class="al w"><b>Gasto, ROAS, CPA e CAC aparecem como "—" neste balde.</b> MRR é renovação de
    assinante de mês anterior: a mídia deste mês não a causou, então não há gasto que dividir.
    Zero não é dado faltando — é a resposta certa.</div>`
 : S.bal==='amostra'
 ? `<div class="al w"><b>Gasto, ROAS e CAC aparecem como "—" neste balde.</b> O mesmo conjunto entrega
    amostra e compra com um orçamento só — separar o gasto exigiria rotular o conjunto, e nenhum
    rótulo descreve as duas coisas. <b>Custo por amostra é métrica de conjunto</b>: está no grid de
    <b>Mídia e campanhas</b>, na coluna <i>Cost/Sample</i>.</div>`
 : S.bal==='compras'
 ? `<div class="al o"><b>Esta é A CONTA.</b> Novos + recompra + novos assinantes sobre o gasto
    <b>total</b> de mídia — mesma definição de <code>core.vw_kpi_mes</code> e da tela Semanal.
    Amostra e MRR entram no faturamento total, mas nunca nesta conta.</div>` : '';
// google_ads x google_organico: o utm_source nao separava (o sufixo `g` do feed do Merchant
// Center serve listagem gratuita E Shopping pago). Quem separa e o gclid. `google` fica no mapa
// por seguranca, para dado antigo nao cair em "Outros".
const GRUPO={meta:'Mídia paga',google:'Mídia paga',google_ads:'Mídia paga',tiktok:'Mídia paga',whatsapp:'Mídia paga',
 google_organico:'Orgânico',google_organic:'Orgânico',
 instagram:'Orgânico',direct:'Orgânico',email:'CRM',nutri:'Profissionais',evento:'Presencial',
 parceria:'Influência',ia:'Orgânico','woo-legado':'Outros','nao-atribuido':'Outros',crm:'CRM',youtube:'Orgânico',
 carta:'Outros',indicacao:'Influência',organico:'Orgânico'};
const dias=D.dias.map(r=>({...r,dia:String(r.dia).slice(0,10)}));
// Fonte da SINTESE: os mesmos pedidos, ja rateados pela jornada (ver query `dlin`). E uma tabela
// separada porque o rateio muda o GRAO — um pedido de 3 canais vira 3 linhas com peso 1/3.
const dlin=(D.dlin||[]).map(r=>({...r,dia:String(r.dia).slice(0,10)}));
const spend=D.spend.map(r=>({...r,dia:String(r.dia).slice(0,10)}));
// MIN sai do dado, nao de constante: o banco comeca em 16/01/2025 e o painel estava cravado em
// 2026-01-01, entao o total de clientes nunca fechava (mostrava 624 onde o historico tem 1.206).
const MAX=dias.reduce((a,r)=>r.dia>a?r.dia:a,'2026-01-01');
const MIN=dias.reduce((a,r)=>r.dia<a?r.dia:a,'9999-12-31');

// Data do snapshot mais recente do Appstle (crm.appstle_subscription) — as views leem
// max(snapshot_em) sozinhas; a tela só precisa DIZER qual é, nunca chumbar a data no texto.
const APPSTLE=(D.appstleSnap||[])[0]||{};
const SNAP_APPSTLE=APPSTLE.snapshot_em?DT(String(APPSTLE.snapshot_em).slice(0,10)):'—';

// ULTIMO DIA FECHADO — fronteira do coletor de gasto do Meta, que roda ~7h atras.
// O dia corrente entra com receita e SEM gasto: em 06/08/2026 foram 11 pedidos e R$ 716,91
// com R$ 0,00 de spend, o que deixava o CPA do grid 24% otimista e o CAC da Semanal 11% barato.
// Toda metrica de CUSTO (CPA, CAC, ROAS) termina aqui; receita pura pode ir ate MAX.
// NAO derivar de `spend` (vw_mvp_custo_dia): o custo mensal e rateado por dia e chega a lancar
// em dia futuro — em 06/08 havia WhatsApp ate 31/08. A fronteira honesta e o grid de midia.
const FECHADO=(D.grid||[]).reduce((a,r)=>{const d=String(r.dia).slice(0,10);
 return (+r.spend>0&&d>a)?d:a},'2026-01-01')||MAX;
const DIA_ABERTO=FECHADO<MAX;
// corta o fim de uma janela no ultimo dia fechado
const jf=j=>j?[j[0],(j[1]>FECHADO?FECHADO:j[1])]:j;
const avisoAberto=(o)=>DIA_ABERTO?`<div class="al w"><b>${DT(MAX)} ainda não fechou.</b>
 O coletor de gasto do Meta vai até ${DT(FECHADO)}, então ${MAX===FECHADO?'':`o dia ${DT(MAX)} tem pedido e não tem gasto`}.
 ${o||'As métricas de custo desta tela param em '+DT(FECHADO)+' — senão o CPA sai barato por falta de denominador.'}</div>`:'';
// COBERTURA DE CADA CONJUNTO DE DADO. Medida do proprio payload, nao chumbada: se a janela da
// query mudar, o aviso acompanha sozinho.
const COB=(arr,c)=>{const v=(arr||[]).map(r=>String(r[c]||'').slice(0,10)).filter(Boolean).sort();
  return v.length?v[0]:null};
const COBERTURA={gasto:COB(D.grid,'dia'), sessao:COB(D.sess,'dia')};
const avisoCobertura=()=>{
  const j=jan(); const ini=String((j||[])[0]||'').slice(0,10); if(!ini)return '';
  const faltam=Object.entries(COBERTURA).filter(([,d])=>d&&ini<d)
    .map(([k,d])=>({gasto:'gasto por campanha',sessao:'sessões e visitantes novos'}[k]+' começa em '+DT(d)));
  return faltam.length?`<div class="al c"><b>O período escolhido começa antes do dado.</b>
   ${faltam.join(' · ')}. Antes disso a coluna fica vazia — <b>não é zero, é ausência</b>, e o

 const bw=(W-P.l-P.r)/s.length, y=v=>P.t+(1-v/mv)*(H-P.t-P.b), y2=v=>P.t+(1-v/mr)*(H-P.t-P.b);
 let g='',b='',x='';
 for(let i=0;i<=4;i++){const v=mv*i/4,yy=y(v);
  g+=`<line x1="${P.l}" x2="${W-P.r}" y1="${yy}" y2="${yy}" stroke="var(--ln2)"/><text x="${P.l-6}" y="${yy+3}" text-anchor="end" font-size="9" fill="var(--t3)">${nf(v/1000,0)}k</text>`}
 s.forEach((d,i)=>{const xx=P.l+i*bw;
  b+=`<rect x="${xx+bw*.13}" y="${y(d.rec)}" width="${bw*.42}" height="${Math.max(0,H-P.b-y(d.rec))}" fill="var(--pt)"><title>${d.k} · faturamento ${R$(d.rec)}</title></rect>`;
  b+=`<rect x="${xx+bw*.57}" y="${y(d.spend)}" width="${bw*.28}" height="${Math.max(0,H-P.b-y(d.spend))}" fill="#C9C9C4"><title>${d.k} · gasto ${R$(d.spend)}</title></rect>`});
 const pts=s.map((d,i)=>{const v=dv(d.rec,d.spend);return v==null?null:`${P.l+i*bw+bw/2},${y2(v)}`}).filter(Boolean).join(' ');
 const lb=s.length>16?s.filter((_,i)=>i%Math.ceil(s.length/8)===0):s;
 lb.forEach(d=>{const i=s.indexOf(d);
  x+=`<text x="${P.l+i*bw+bw/2}" y="${H-7}" text-anchor="middle" font-size="9" fill="var(--t3)">${d.k.length>7?d.k.slice(8)+'/'+d.k.slice(5,7):MS[+d.k.slice(5,7)-1]}</text>`});
 for(let i=0;i<=3;i++){const v=mr*i/3;x+=`<text x="${W-P.r+6}" y="${y2(v)+3}" font-size="9" fill="var(--lj)">${nf(v,1)}</text>`}
 return `<svg class="cht" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Faturamento e gasto em barras, ROAS em linha">${g}${b}<polyline points="${pts}" fill="none" stroke="var(--lj)" stroke-width="2" vector-effect="non-scaling-stroke"/>${x}</svg>
 <div class="lgd"><span><i style="background:var(--pt)"></i>Faturamento</span><span><i style="background:#C9C9C4"></i>Gasto</span><span><i style="background:var(--lj)"></i>ROAS (eixo direito)</span></div>`}
function chartStack(s,cats){
 if(!s.length)return '<div class="emp">Sem dados.</div>';
 const mx=Math.max(...s.map(d=>cats.reduce((a,c)=>a+d['r_'+c],0)))||1, w=100/s.length;
 let g='';
 s.forEach((d,i)=>{let acc=0;
  cats.forEach(c=>{const h=d['r_'+c]/mx*100; if(h<=0)return;
   g+=`<rect x="${i*w+w*.14}%" y="${100-acc-h}%" width="${w*.72}%" height="${h}%" fill="${CAT[c].cor}"><title>${d.k} · ${CAT[c].n}: ${R$(d['r_'+c])}</title></rect>`;acc+=h})});
 return `<svg viewBox="0 0 100 100" preserveAspectRatio="none" style="width:100%;height:186px;display:block" role="img" aria-label="Composição do faturamento por tipo de cliente">${g}</svg>
 <div style="display:flex;margin-top:5px">${s.map(d=>`<div style="flex:1;text-align:center;font-size:10px;color:var(--t3)">${d.k.length>7?d.k.slice(8):MS[+d.k.slice(5,7)-1]}</div>`).join('')}</div>
 <div class="lgd">${cats.map(c=>`<span><i style="background:${CAT[c].cor}"></i>${CAT[c].n}</span>`).join('')}</div>`}

 const SM=D.ksem||[];

 // Custo so existe ate FECHADO, entao a janela inteira e cortada ali — numerador e denominador

 const j=jf(jan()), jc=janC(j);
 const _b=S.bal,_c=S.cat; S.bal='';S.cat='';
 const A=agg(j), B=jc?agg(jc):null;
 S.bal=_b;S.cat=_c;

  ${cdS('ROAS novos',RT(dv(NR(A),A.spend)),`${dlOk(dv(NR(A),A.spend),B?dv(NR(B),B.spend):null)} · receita de novos ÷ gasto · meta do mês ${RT(mes.roas_novos_meta)}`)}
  ${cdS('CAC novos',R0(cacA),`${dlRuim(cacA,cacB)} · gasto ÷ todos os novos · meta do mês ${R0(mes.cac_meta)}`)}
  ${cdS('Investido',R0(A.spend),`${dlOk(A.spend,B?B.spend:null)} vs período anterior`)}
 </div>`;
 const conta=`<div class="gr g6">

   const meta = w.semana_parcial ? (w.fat_op_meta||0)*(w.dias_decorridos||0)/7 : w.fat_op_meta;

     <td>${R0(w.fat_op)}</td><td>${semMeta?'—':R0(meta)+(parcial?` <span class="t3">(${w.dias_com_plano}d)</span>`:'')}</td>
     <td>${semMeta?'—':PC(p)}</td><td>${w.qtd_novos}</td><td>${R0(w.custo_total)}</td>
     <td>${R0(w.cac_novos_4s)}</td><td>${RT(w.roas_compras_liq_4s)}</td>
     <td style="color:${cor};font-weight:650">${w.acao}</td></tr>`}).join('');

 // DE ONDE VEM OS NOVOS — pago x nao-pago, no periodo do seletor. Novos = novo_avulso +
 // novo_assinatura, pela atribuicao de aquisicao. CAC so existe no lado pago (o nao-pago nao tem
 // denominador — e o ponto: cliente que chega de graca).
 const jp=jan(), A3=agg(jp,{canalView:true});

 return `${avisoAberto('As métricas de custo abaixo fecham em '+DT(FECHADO)+' — o dia aberto ainda não tem o gasto coletado, então o período é cortado ali.')}
 <div class="sc"><div class="sch"><div><h2>Novos — ${DT(j[0])} a ${DT(j[1])}</h2>

  ${novos}</div>
 ${tesePagoNP}
 <div class="sc"><div class="sch"><div><h2>Semana a semana</h2>

/* ==================== VISÃO GERAL — a árvore de KPIs, no mês corrente ==================== */
// Uma tela = a arvore inteira (30/08/2026). Cada bloco e uma PERGUNTA com 3-4 numeros e um link
// para a tela que aprofunda. FIXA NO MES CORRENTE de proposito: e a tela de abrir de manha, nao
// de investigar — os filtros da barra nao se aplicam aqui.
// Formato do Gabriel (30/08): FATURAMENTO TOTAL em cima, as CINCO QUEBRAS que o compoem (novos
// compra unica + novos assinantes + recompra + MRR + amostras = 100% do faturamento, mesmas
// linhas de core.plano_mes), e embaixo os INDICADORES derivados. Nada de blocos tematicos aqui —
// a investigacao mora nas outras telas.
function pgVisao(){
 const mes=mesCorrente();
 const mesIni=MAX.slice(0,7)+'-01';
 // PERÍODO AGORA SE APLICA (pedido do Gabriel, 03/10: "precisa conseguir segmentar as datas").
 // Janela do seletor; quando ela É o mês corrente, a tela vira a leitura clássica de abrir o
 // dia, com metas e ritmo. Metas são mensais: fora do mês corrente as quebras mostram R$ e
 // % do total, e a "Quebra da meta" segue SEMPRE o mês corrente. Balde, tipo de cliente,
 // canal e atribuição continuam sem efeito aqui — a definição das cinco linhas é fixa.
 const j=jan()||[mesIni,MAX];
 const noMes=j[0]===mesIni&&j[1]===MAX;
 const T=dreJanela(j), cx=caixaGerado(T);
 let sess=0; for(const r of (D.sess||[])){const d=String(r.dia).slice(0,10);if(inP(d,j))sess+=(+r.sessoes||0)}
 // agregado da janela por categoria (mesma camada das outras telas), com filtros fixos zerados
 const _b=S.bal,_c=S.cat,_cn=S.can,_g=S.gru; S.bal='';S.cat='';S.can='';S.gru='';
 const A=agg(j); S.bal=_b;S.cat=_c;S.can=_cn;S.gru=_g;
 const W={ fat:noMes?+mes.fat_total:T.faturamento,
   novos_unica:noMes?+mes.fat_novos:A.r_novo_avulso,
   novos_assin:noMes?+mes.novos_assinantes:A.r_novo_assinatura+A.r_antigo_inicio_assinatura,
   qtd_assin:noMes?+mes.qtd_assin_novas:Math.round(A.p_novo_assinatura+A.p_antigo_inicio_assinatura),
   recompra:noMes?+mes.fat_recorrente:A.r_antigo_avulso,
   mrr:noMes?+mes.mrr:A.r_recorrente,
   amostra:noMes?+mes.amostra:A.r_amostra,
   qtd_amostras:noMes?+mes.qtd_amostras:Math.round(A.p_amostra),
   qtd_novos:noMes?+mes.qtd_novos:Math.round(A.p_novo_avulso+A.p_novo_assinatura),
   investido:noMes?+mes.custo_total:A.spend,
   cac:noMes?+mes.cac_novos:dv(A.spend,A.p_novo_avulso+A.p_novo_assinatura) };
 const tituloJ=noMes?null:`${DT(j[0])} a ${DT(j[1])}`;
 const mesNome=mes.mes?MSL[+String(mes.mes).slice(5,7)-1]:MSL[+MAX.slice(5,7)-1];
 const somaQb=W.novos_unica+W.novos_assin+W.recompra+W.mrr+W.amostra;
 const pTot=v=>(noMes?mes.fat_total:somaQb)?PC(100*v/(noMes?mes.fat_total:somaQb)):'—';
 // quebra: R$ + % do total (+ meta só quando a janela é o mês corrente — meta é mensal)
 const qb=(t,v,metaV,extra)=>cdS(t,R0(v),
   `${pTot(v)} do total${noMes&&metaV?` · meta ${R0(metaV)} (${PC(pctD(v,metaV))})`:''}${extra?' · '+extra:''}`);
 // ticket sem amostra: tira a receita E os pedidos de amostra
 const pedSem=(T.pedidos||0)-(W.qtd_amostras||0);
 const tkSem=dv((W.fat||0)-(W.amostra||0), pedSem>0?pedSem:null);
 // payback — o numero que decide escalar midia, consolidado dos cohorts com custo registrado
 let pbHtml='';
 (()=>{const pb=(D.payback||[]).filter(r=>r.cac_aprox!=null&&+r.cac_aprox>0);
  if(!pb.length)return;
  const sp2=pb.reduce((a,r)=>a+ +r.spend,0), cl=pb.reduce((a,r)=>a+ +r.clientes,0);
  const mg=pb.reduce((a,r)=>a+(+r.margem_180_por_cliente||0)*(+r.clientes),0);
  const rz=dv(mg,sp2); if(rz==null)return;
  pbHtml=`<div class="al ${rz>=1?'o':'c'}"><b>Payback em 180 dias: ${rz.toFixed(2).replace('.',',')}x.</b>
   ${R0(sp2)} de mídia trouxeram ${IN(cl)} clientes pagantes, que devolveram ${R$(dv(mg,cl))} de margem
   por cliente contra um CAC de ${R$(dv(sp2,cl))}. ${rz<1?'<b>A mídia ainda não se paga</b> — os dois consertos moram em Aquisição (CAC ↓, não-pago ↑) e em Base (retenção ↑).':''}</div>`})();
 const sh=(D.saude||[]).filter(p=>p.status!=='OK').map(p=>`<div class="al ${p.status==='ATRASADO'?'w':'c'}"><div><b>${p.fonte}</b> <span class="pl g">${p.tipo}</span> — ${p.status.toLowerCase()} · idade ${nf(+p.idade_horas,1)}h · SLA ${p.sla_horas}h</div></div>`).join('');

 return `${noMes
  ?`<div class="al o"><b>Mês corrente (${mesNome})</b> — a leitura de abrir o dia, com metas e ritmo.
    O <b>período</b> da barra muda o recorte; balde, tipo, canal e atribuição não se aplicam aqui.</div>`
  :`<div class="al o"><b>Período do seletor: ${tituloJ}.</b> Metas são mensais, então aparecem só com
    período “Este mês” — e a <b>Quebra da meta</b> abaixo segue sempre o mês corrente (${mesNome}).
    Balde, tipo, canal e atribuição não se aplicam aqui.</div>`}
 <div class="sc"><div class="gr" style="grid-template-columns:1fr">
  <div class="cd"><div class="k">Faturamento total — ${noMes?mesNome:tituloJ}</div>
   <div class="v" style="font-size:34px">${R0(W.fat)}</div>
   <div class="c">${noMes?`<span class="f">meta ${R0(mes.fat_meta)}</span> · ritmo ${PC(mes.pct_fat)} · `:''}
    <span class="f">${IN(T.pedidos)} pedidos · investido ${R0(W.investido)}${noMes?` (orçamento ${R0(mes.custo_meta_plano)})`:' · custo fecha em '+DT(FECHADO)}</span></div></div>
 </div></div>
 <div class="sc"><div class="sch"><div><h2>Quebras do faturamento</h2>
  <p>As cinco linhas somam 100% do total — mesmas linhas de <code>core.plano_mes</code>.</p></div></div>
  <div class="gr g6">
   ${qb('Novos clientes (compra única)',W.novos_unica,mes.fat_novos_meta)}
   ${qb('Novos assinantes',W.novos_assin,mes.novos_assinantes_meta,IN(W.qtd_assin)+' assinaturas')}
   ${qb('Recompra',W.recompra,mes.fat_recorrente_meta)}
   ${qb('MRR',W.mrr,mes.mrr_meta,'concentra no fim do mês')}
   ${qb('Amostras',W.amostra,mes.amostra_meta,IN(W.qtd_amostras)+' amostras')}
  </div></div>
 <div class="sc"><div class="sch"><div><h2>Indicadores</h2></div></div>
  <div class="gr g6">
   ${cdS('CAC novos clientes',R0(W.cac),`gasto total ÷ TODOS os novos (única + assinatura, ${IN(W.qtd_novos)}) · amostra fora${noMes?` · meta ${R0(mes.cac_meta)}`:''}`)}
   ${cdS('Conversão do site (total)',PC(dv(100*T.pedidos,sess),2),`${IN(T.pedidos)} pedidos ÷ ${IN(sess)} sessões · inclui amostra`)}
   ${cdS('Ticket médio (geral)',R$(dv(T.faturamento,T.pedidos)),'todos os pedidos, amostra incluída')}
   ${cdS('Ticket médio (sem amostras)',R$(tkSem),`${IN(pedSem>0?pedSem:null)} pedidos pagos`)}
   ${cdS('Caixa gerado',R0(cx),'fat − taxas − frete − mídia · sem CMV (estoque já pago)')}
   ${cdS('Resultado (com CMV)',`<span style="color:${T.resultado>=0?'var(--vd)':'var(--vm)'}">${R0(T.resultado)}</span>`,'quando o estoque precisar de reposição')}
  </div></div>
 <div class="sc"><div class="sch"><div><h2>Quebra da meta — ${mesNome}</h2>
  <p>Sempre do mês corrente, independente do período. “Deveria estar” = meta × dias decorridos. O MRR concentra no fim do mês${APPSTLE.ativas?` (${IN(APPSTLE.fim_mes)} das ${IN(APPSTLE.ativas)} cobranças ativas no Appstle caem do dia 28 em diante)`:''}.</p></div></div>${quebraMeta(mes)}</div>
 <div class="sc"><div class="sch"><div><h2>Alertas</h2></div></div>${pbHtml}${sh||'<div class="al o">Todas as fontes de dado dentro do SLA.</div>'}</div>`;
}

/* ==================== AMOSTRAS — o motor de aquisição barata ==================== */
// Amostra entra no faturamento, mas NUNCA e cliente pagante nem entra no CAC. O que se cobra dela
// e CONVERSAO: virou pagante? em quanto tempo? a que custo por amostra?
function pgAmostras(){
 const j=jan(),jc=janC(j),A=agg(j),B=jc?agg(jc):null;
 const jr={}; (D.jor||[]).forEach(x=>jr[x.e]={n:+x.n,v:+x.v});
 const amT=jr.am_total?.n||0, amAv=jr.am_avulso?.n||0, amAs=jr.am_assin?.n||0, amSem=jr.am_sem?.n||0;
 const conv=dv(amAv+amAs,amT);
 const t1=(D.tempo||[]).find(t=>+t.ord===1);
 // custo por amostra: conjuntos onde amostra > aquisicao no periodo FECHADO — mesma regra da
 // definicao "Mídia por amostra". Nao rateia conjunto misto; e aproximacao declarada.
 const jf2=jf(j); let spAm=0,qAm=0;
 const porCj={};
 for(const r of (D.camp||[])){const d=String(r.dia).slice(0,10); if(!inP(d,jf2))continue;
  const k=r.campanha+'|'+r.conjunto, o=porCj[k]||(porCj[k]={sp:0,am:0,aq:0});
  o.sp+=(+r.spend||0); o.am+=(+r.ped_amostra||0); o.aq+=(+r.ped_aquisicao||0)}
 for(const o of Object.values(porCj)){ if(o.am>o.aq&&o.am>0){spAm+=o.sp;qAm+=o.am} }
 const fnB=(v,n,base)=>`<div class="fnr"><div class="fnb ${v?'lj':'g'}" style="width:${Math.max(52,(base!=null?(dv(v,base)||0):1)*260)}px">${IN(v)}</div><div class="fnl">${n}${base?` · ${PC((dv(v,base)||0)*100)}`:''}</div></div>`;
 const sm=serie([MIN,MAX],'mes');
 const tbl=sm.slice(-12).reverse().map(d=>`<tr><td class="l">${MS[+d.k.slice(5,7)-1]}/${d.k.slice(2,4)}</td>
   <td>${IN(d.p_amostra)}</td><td>${R0(d.r_amostra)}</td></tr>`).join('');
 return `<div class="sc"><div class="gr g6">
   ${CD('amos',A,B)}
   ${cdS('Receita de amostra',R0(A.r_amostra),'entra no faturamento, nunca no CAC')}
   ${cdS('CAC por amostra',R$(dv(spAm,qAm)),`gasto dos conjuntos de amostra ÷ amostras que entregaram (${IN(qAm)}) · período fechado`)}
   ${cdS('Conversão amostra → pagante',PC((conv||0)*100),'histórico completo')}
   ${cdS('Tempo até converter',t1?IN(t1.mediana_dias)+' dias':'—',t1?`mediana · P25 ${IN(t1.p25_dias)}d · P75 ${IN(t1.p75_dias)}d`:'')}
  </div></div>
 <div class="sc"><div class="sch"><div><h2>Funil da amostra — histórico completo</h2>
  <p>Quem recebeu amostra alguma vez, e o que fez depois. A conversão é a razão de existir do motor.</p></div></div>
  <div class="pn"><div class="pnb"><div class="fn">
   ${fnB(amT,'receberam amostra')}
   ${fnB(amAv,'viraram cliente — compra única',amT)}
   ${fnB(amAs,'viraram cliente — assinatura',amT)}
   ${fnB(amSem,'nunca compraram',amT)}
  </div></div></div></div>
 <div class="sc"><div class="sch"><div><h2>Amostras por mês</h2></div></div>
  <div class="tw"><table><thead><tr><th class="l">Mês</th><th>Amostras</th><th>Receita</th></tr></thead>
  <tbody>${tbl||'<tr><td colspan="3" class="emp">Sem dados.</td></tr>'}</tbody></table></div></div>
 <div class="sc"><div class="al w"><b>CAC por amostra é métrica de conjunto, não de balde.</b> O mesmo
  conjunto entrega amostra e compra com um orçamento só — o número acima soma apenas conjuntos onde a
  amostra domina (amostras &gt; aquisições). O detalhe por conjunto está em <b>Canais e campanhas</b>,
  coluna <i>Cost/Sample</i>.</div></div>`;
}

 const tempos=(D.tempo||[]).filter(t=>+t.ord>=2).map(t=>`<tr><td class="l">${t.etapa}</td>

/* ==================== JORNADA — o site converte? ==================== */
// % CR e ticket POR PDP, juntos (regra do Gabriel, 30/08): a escada 1/3/6 pode subir CR derrubando
// ticket — so o produto dos dois (R$/sessao) compara PDPs de verdade.
function pgJornada(){
 const j=jan();
 const P=(D.pdp||[]).filter(r=>inP(String(r.dia).slice(0,10),j));
 let sess=0,nv=0; for(const r of (D.sess||[])){const d=String(r.dia).slice(0,10);
  if(inP(d,j)){sess+=(+r.sessoes||0);nv+=(+r.nv||0)}}
 let sp2=0; for(const s of spend){if(inP(s.dia,j))sp2+=(+s.custo||0)}
 let ped=0; for(const r of dias){if(inP(r.dia,j))ped+=r.pedidos}
 const porP={};
 for(const r of P){const o=porP[r.pdp]||(porP[r.pdp]={pdp:r.pdp,sessoes:0,pedidos:0,pagos:0,receita:0});
  o.sessoes+=(+r.sessoes||0);o.pedidos+=(+r.pedidos||0);o.pagos+=(+r.pedidos_pagos||0);o.receita+=(+r.receita||0)}
 const rows=Object.values(porP).filter(r=>r.sessoes>=10).sort((a,b)=>b.sessoes-a.sessoes).slice(0,25);
 const tot=rows.reduce((a,r)=>{a.sessoes+=r.sessoes;a.pedidos+=r.pedidos;a.pagos+=r.pagos;a.receita+=r.receita;return a},{sessoes:0,pedidos:0,pagos:0,receita:0});
 const T=TB([
  {k:'p',t:'PDP',l:1,fx:1,f:r=>r.pdp==='kit-descoberta'?`${r.pdp} <span class="pl i">amostra</span>`:r.pdp,raw:r=>r.pdp,tf:()=>'<b>Total</b>'},
  {k:'s',t:'Sessões',f:r=>IN(r.sessoes),raw:r=>r.sessoes,tf:t=>IN(t.sessoes)},
  {k:'pe',t:'Pedidos',f:r=>IN(r.pedidos),raw:r=>r.pedidos,tf:t=>IN(t.pedidos)},
  {k:'cr',t:'% CR',tip:'Pedidos ÷ sessões que viram a PDP. Sessão que viu duas PDPs conta nas duas.',
   f:r=>{const v=dv(100*r.pedidos,r.sessoes);return v==null?'—':`<b>${PC(v,2)}</b>`},raw:r=>dv(100*r.pedidos,r.sessoes)??-1,tf:t=>PC(dv(100*t.pedidos,t.sessoes),2)},
  {k:'pg2',t:'Pedidos pagos',tip:'Sem amostra.',f:r=>IN(r.pagos),raw:r=>r.pagos,tf:t=>IN(t.pagos)},
  {k:'crp',t:'% CR paga',f:r=>PC(dv(100*r.pagos,r.sessoes),2),raw:r=>dv(100*r.pagos,r.sessoes)??-1,tf:t=>PC(dv(100*t.pagos,t.sessoes),2)},
  {k:'r',t:'Receita',f:r=>R0(r.receita),raw:r=>r.receita,tf:t=>R0(t.receita)},
  {k:'tm',t:'Ticket',tip:'Receita ÷ pedidos das sessões que viram a PDP.',f:r=>R$(dv(r.receita,r.pedidos)),raw:r=>dv(r.receita,r.pedidos)??0,tf:t=>R$(dv(t.receita,t.pedidos))},
  {k:'rps',t:'R$ / sessão',tip:'CR × ticket — o desempate entre PDPs.',ce:1,
   f:r=>`<b>${R$(dv(r.receita,r.sessoes))}</b>`,raw:r=>dv(r.receita,r.sessoes)??0,tf:t=>R$(dv(t.receita,t.sessoes))}
 ],rows,tot);
 return `<div class="sc"><div class="gr g6">
   ${cdS('Sessões',IN(sess),'medidas no site, todos os canais')}
   ${cdS('% CR geral',PC(dv(100*ped,sess),2),`${IN(ped)} pedidos ÷ sessões · inclui amostra`)}
   ${cdS('Custo por sessão',R$(dv(sp2,sess)),'gasto de mídia ÷ todas as sessões')}
   ${cdS('% visitantes novos',PC(dv(100*nv,sess)),'sessão que é a 1ª do aparelho na base')}
  </div></div>
 <div class="sc"><div class="sch"><div><h2>Por PDP — % CR e ticket, juntos</h2>
  <p>CR alto com ticket baixo (ou o contrário) engana — <b>R$ por sessão</b> é o produto dos dois e
  decide qual página merece o tráfego. Pedido é creditado à sessão que <b>viu</b> a PDP.</p></div></div>
  <div class="pn">${T.html}</div></div>
 <div class="sc"><div class="al w"><b>Cobertura desde 2026</b> — sessões e PDP não existem para 2025.
  Sessão que visitou mais de uma PDP conta em todas (por isso a soma das linhas passa do total de
  pedidos do período). PDPs com menos de 10 sessões ficam fora da tabela.</div>
  <div class="al o"><b>kit-descoberta é a PDP da amostra</b> — o CR dela mede o funil de amostra
  (pedidos pagos ≈ 0 é o esperado); a conversão em cliente pagante está na tela Amostras.</div></div>`;
}
/* ==================== RESULTADO — DRE de contribuicao ==================== */
// Pedido do Gabriel em 08/08: "uma tabela sempre tipo: gasto total; custo produto (envio+cmv);
// faturamento --> o resultado liquido real. isso sera bom inclusive para ver descontos".
// O que essa tela adiciona e o FRETE. Todas as outras margens do painel sao `margem_antes_frete`,
// e 93% dos pedidos de julho sairam com frete gratis — o custo existia e nao aparecia em lugar
// nenhum. Fonte em core.vw_dre_dia (cells-infra/fixes/2026-08-08-vw-dre-dia.sql).
//
// 11/08: esta tela lia uma view montada sobre `commerce.orders_enriched`, que e SO Shopify,
// enquanto todo o resto do painel le `core.vw_app_pedido` (Shopify + Woo). Dava dois faturamentos
// para o mesmo mes no mesmo painel — julho R$ 29.989,01 aqui contra R$ 31.906,21 no Resumo — e
// inflava o prejuizo em 19,3%. A view foi corrigida (2026-08-11-vw-dre-dia-inclui-woo.sql) e agora
// bate com core.vw_kpi_mes em 20 de 20 meses.
//
// NAO respeita balde nem canal de proposito: e o resultado do negocio inteiro, nao de um recorte.
// Respeitar o filtro de canal daria um "resultado" por canal que subtrai a midia do canal mas
// carrega o CMV do negocio todo — numero sem significado.
function pgResultado(){
 const j=jan(), R=(D.dre||[]).filter(r=>inP(String(r.dia).slice(0,10),j));
 if(!R.length) return `<div class="emp">Sem dado no período. Confira <code>core.vw_dre_dia</code>.</div>`;
 const K=['pedidos','pedidos_sem_cmv','pedidos_frete_estimado','pedidos_fora_do_bling','valor_tabela','descontos',

 const T=Object.fromEntries(K.map(k=>[k,R.reduce((a,r)=>a+(+r[k]||0),0)]));
 const pf=v=>T.faturamento?PC(100*v/T.faturamento):'—';

 const cx=caixaGerado(T);
 const cds=`<div class="gr g6">

   <div class="c f">${IN(T.pedidos)} pedidos</div></div>
  <div class="cd"><div class="k"><span class="h" title="Faturamento − taxas − frete − mídia, SEM tirar o CMV. O estoque já foi pago: vender do estoque existente gera caixa mesmo com margem contábil ruim. Vale até o estoque precisar de reposição.">Caixa gerado (sem CMV)</span></div>

   <div class="c f">${pf(T.margem_contribuicao)} do faturamento · antes da mídia</div></div>
  <div class="cd"><div class="k">Mídia</div><div class="v">${R0(T.midia)}</div>
   <div class="c f">${pf(T.midia)} do faturamento</div></div>
  <div class="cd"><div class="k">Resultado (com CMV)</div>
   <div class="v" style="color:${T.resultado>=0?'var(--ok)':'var(--er)'}">${R0(T.resultado)}</div>
   <div class="c f">a régua de quando o estoque acabar</div></div></div>`;

 // COMPOSICAO DA CONTA (mudou de Aquisicao para ca em 30/08, pedido do Gabriel): e leitura de
 // RESULTADO — de onde veio o dinheiro do periodo. Ignora balde/canal como o resto da tela.
 const comp=(()=>{
  const _b=S.bal,_c=S.cat,_cn=S.can,_g=S.gru; S.bal='';S.cat='';S.can='';S.gru='';
  const A2=agg(j); S.bal=_b;S.cat=_c;S.can=_cn;S.gru=_g;
  return `<div class="gr g6">
   ${cdS('1 · Novos (compra única)',R0(A2.r_novo_avulso),`${IN(A2.p_novo_avulso)} pedidos`)}
   ${cdS('2 · Recompra (antigos)',R0(A2.r_antigo_avulso),`${IN(A2.p_antigo_avulso)} pedidos · cliente que já tinha comprado`)}
   ${cdS('3 · Novos assinantes',R0(A2.r_novo_assinatura+A2.r_antigo_inicio_assinatura),`${IN(A2.p_novo_assinatura+A2.p_antigo_inicio_assinatura)} assinaturas · vira MRR no mês que vem`)}
   ${cdS('Fora · Amostra',R0(A2.r_amostra),`${IN(A2.p_amostra)} amostras · não é venda que a mídia paga`)}
   ${cdS('Fora · MRR',R0(A2.r_recorrente),'renovação de assinante de mês anterior')}
  </div>`})();

 const L=(n,v,sinal,forte,dica)=>`<tr${forte?' class="tot"':''}>
   <td class="l fx">${sinal||''} ${n}${dica?` <span class="t3" title="${dica}">ⓘ</span>`:''}</td>
   <td style="text-align:right${forte?';font-weight:700':''}${v<0&&forte?';color:var(--er)':''}">${R0(v)}</td>
   <td style="text-align:right" class="t3">${pf(v)}</td></tr>`;
 const cascata=`<div class="tw"><table><thead><tr>
   <th class="l fx">Linha</th><th style="text-align:right">Valor</th>
   <th style="text-align:right">% do faturamento</th></tr></thead><tbody>
  ${L('Valor de tabela',T.valor_tabela,'','',
      'Soma dos pedidos antes de desconto (total_price + total_discounts).')}
  ${L('Descontos',-T.descontos,'(−)','',
      'Cupons e promoções concedidos. Em julho foi 5,9% do valor de tabela.')}
  ${T.reembolsos>0?L('Reembolsos',-T.reembolsos,'(−)','',
      'Estornos ao cliente. Saem do faturamento para esta tela bater com o Resumo, que também lê o valor líquido de reembolso.'):''}
  ${L('Faturamento cobrado',T.faturamento,'=','1')}
  ${L('Custo do produto (CMV)',-T.cmv,'(−)','',
      'Custo unitário por SKU em commerce.produto_custo.')}
  ${L('Taxas e impostos',-T.taxas,'(−)','',
      'Gateway 4% + Shopify 2% + Simples 6% + provisão de devolução 0,7% = 12,7%.')}
  ${L('Frete líquido',-T.frete_liquido,'(−)','',
      'Custo real por pedido, do Bling, menos o frete cobrado do cliente. SEDEX em SP sai ~R$ 11; Express fora de SP ~R$ 19.')}
  ${L('MARGEM DE CONTRIBUIÇÃO',T.margem_contribuicao,'=','1')}
  ${L('Mídia',-T.midia,'(−)','','Meta e Google Ads por API; WhatsApp e Klaviyo lançados à mão em ads.custos_canal.')}
  ${L('RESULTADO',T.resultado,'=','1')}
  ${L('CMV de volta',T.cmv,'(+)','','O estoque já foi pago — o CMV não é saída de caixa deste período.')}
  ${L('CAIXA GERADO',cx,'=','1','Faturamento − taxas − frete − mídia. A régua de hoje, enquanto se vende do estoque existente. Quando ele precisar de reposição, quem manda volta a ser o RESULTADO.')}
 </tbody></table></div>`;

 // serie mensal
 const M2={};
 for(const r of R){const k=String(r.dia).slice(0,7); const o=M2[k]||(M2[k]=Object.fromEntries(K.map(x=>[x,0])));
   K.forEach(x=>o[x]+=(+r[x]||0))}
 const meses=Object.entries(M2).sort((a,b)=>a[0]<b[0]?1:-1);
 const serie=`<div class="tw"><table><thead><tr><th class="l fx">Mês</th>
   <th style="text-align:right">Faturamento</th><th style="text-align:right">Descontos</th>
   <th style="text-align:right">CMV</th><th style="text-align:right">Taxas</th>
   <th style="text-align:right">Frete</th><th style="text-align:right">Margem contrib.</th>
   <th style="text-align:right">Mídia</th><th style="text-align:right">Caixa gerado</th><th style="text-align:right">Resultado</th></tr></thead><tbody>
  ${meses.map(([k,o])=>`<tr><td class="l fx">${k}</td>
    <td style="text-align:right">${R0(o.faturamento)}</td>
    <td style="text-align:right" class="t3">${R0(o.descontos)}</td>
    <td style="text-align:right" class="t3">${R0(o.cmv)}</td>
    <td style="text-align:right" class="t3">${R0(o.taxas)}</td>
    <td style="text-align:right" class="t3">${R0(o.frete_liquido)}</td>
    <td style="text-align:right">${R0(o.margem_contribuicao)}</td>
    <td style="text-align:right" class="t3">${R0(o.midia)}</td>
    <td style="text-align:right;font-weight:650;color:${caixaGerado(o)>=0?'var(--vd)':'var(--vm)'}">${R0(caixaGerado(o))}</td>
    <td style="text-align:right;font-weight:650;color:${o.resultado>=0?'var(--ok)':'var(--er)'}">${R0(o.resultado)}</td>
    </tr>`).join('')}
 </tbody></table></div>`;

 const avisos=[
  `<div class="al w"><b>Isto é margem de contribuição, não lucro.</b> Não há custo fixo aqui —
   salário, pró-labore, ferramenta, contabilidade. "Resultado" positivo não significa empresa no azul.</div>`,
  T.pedidos_frete_estimado>0
   ? `<div class="al w"><b>O frete é real, do Bling</b> (<code>logisticas/objetos</code>), pedido a
      pedido — <b>${IN(T.pedidos-T.pedidos_frete_estimado)} de ${IN(T.pedidos)}</b> deste período.
      ${IN(T.pedidos_frete_estimado)} sem <code>volume_id</code> caem no parâmetro declarado
      <code>frete_medio_por_envio</code>. O rastreio só grava <code>volume_id</code> desde
      <b>14/04/2026</b> — antes disso tudo é estimativa.${
      T.pedidos_fora_do_bling>0
       ? ` Desses, <b>${IN(T.pedidos_fora_do_bling)}</b> ${T.pedidos_fora_do_bling===1?'é pedido do':'são pedidos do'}
          <b>WooCommerce</b> (assinatura legado do CellsClub), que não passa pelo Bling: o frete
          ${T.pedidos_fora_do_bling===1?'dele':'deles'} <b>nunca</b> será medido, sempre o parâmetro declarado.`
       : ''}</div>`
   : `<div class="al o"><b>O frete é real, do Bling</b> (<code>logisticas/objetos</code>), em todos
      os ${IN(T.pedidos)} pedidos do período. Nenhuma estimativa aqui.</div>`,
  T.pedidos_sem_cmv>0
   ? `<div class="al c"><b>${IN(T.pedidos_sem_cmv)} ${T.pedidos_sem_cmv===1?'pedido entra':'pedidos entram'} com CMV zero.</b>
      ${T.pedidos_sem_cmv===1?'Ele não tem':'Eles não têm'} custo cadastrado em
      <code>commerce.produto_custo</code>, então ${T.pedidos_sem_cmv===1?'entra':'entram'} com custo
      zero e <b>inflam a margem</b> deste período.</div>` : '',
  `<div class="al o"><b>Esta tela ignora os filtros de balde e de canal.</b> É o resultado do
   negócio inteiro. Um "resultado por canal" subtrairia a mídia do canal mas carregaria o CMV do
   negócio todo — número sem significado.</div>`
 ].join('');

 return `${cds}
 <div class="sc"><div class="sch"><div><h2>Composição da conta</h2>
  <p>De onde veio o dinheiro do período. Amostra e MRR aparecem, mas não entram no ROAS nem no CAC.</p></div></div>${comp}</div>
 <div class="sc"><div class="sch"><div><h2>Da venda ao resultado</h2>
  <p>Cada linha do período, e quanto ela pesa sobre o faturamento.</p></div></div>${cascata}</div>
 <div class="sc"><div class="sch"><div><h2>Mês a mês</h2></div></div>${serie}</div>
 <div class="sc">${avisos}</div>`;
}

/* ============ CANAIS E CAMPANHAS — a tela unica (08/08/2026) ============ */
// Fundiu "Atribuicao" e "Midia e campanhas". Elas mediam a MESMA coisa de dois jeitos: em julho o
// Meta dava R$ 20.688,70 / 196 pedidos no grid (vw_ads_metricas_dia, last click) contra
// R$ 15.377,07 / 169 na Atribuicao (vw_app_pedido, first touch) — 35% de diferenca. Empilhar as
// duas daria uma tabela onde o pai nao bate com os filhos.
//
// REGRA DA FUSAO (pedido do Gabriel: "precisa ser atribuicao em tudo"): receita, pedidos, clientes
// e margem saem SEMPRE de vw_app_pedido, em todo nivel, para todo canal. Do Meta vem apenas GASTO
// e as colunas reportadas pela plataforma, marcadas em cinza. Assim a tela concorda com Resumo,
// Semanal e Mensal, e filho sempre soma no pai — verificado nos 4 niveis, zero divergencia.
//
// Gasto de CANAL vem de vw_mvp_custo_dia (cobre google_ads e whatsapp, que o grid nao tem); nos
// niveis abaixo vem do grid. Os dois fecham exato (61 dias, R$ 26.265,03 dos dois lados), entao o
// gasto tambem soma de baixo para cima.
function pgCanais(){
 const j=jan(), A=agg(j,{canalView:true}), jf2=jf(j);
 const PL={}, GS={};
 for(const r of (D.grid||[])){
  const d=String(r.dia).slice(0,10); if(!inP(d,jf2))continue;
  // CHAVE COM O CANAL NA FRENTE. Sem ele, qualquer canal com campanha de mesmo nome puxava o
  // gasto e as impressoes do Meta: a linha `direct > 2026_06_VENDAS` (1 pedido, R$ 299,70)
  // aparecia com R$ 3.495 de gasto e 93.183 impressoes, ROAS 0,09. O Gabriel pegou em 08/08.
  const an=r.anuncio||'(sem anúncio)', c0=r.canal;
  for(const k of [c0+'|'+r.campanha, c0+'|'+r.campanha+'|'+r.conjunto,
                  c0+'|'+r.campanha+'|'+r.conjunto+'|'+an]){
   const o=PL[k]||(PL[k]={spend:0,impressoes:0,ob_clicks:0,plat_lpv:0,plat_atc:0,plat_checkout:0});
   o.spend+=(+r.spend||0); o.impressoes+=(+r.impressoes||0); o.ob_clicks+=(+r.ob_clicks||0);
   o.plat_lpv+=(+r.plat_lpv||0); o.plat_atc+=(+r.plat_atc||0); o.plat_checkout+=(+r.plat_checkout||0);
  }
 }
 for(const x of spend){ if(inP(x.dia,jf2)) GS[x.fonte]=(GS[x.fonte]||0)+(+x.custo||0) }
 // SESSOES / VISITANTES NOVOS — mesma chave da arvore, entao casam em qualquer nivel.
 const SE={};
 for(const r of (D.sess||[])){
  const d=String(r.dia).slice(0,10); if(!inP(d,jf2))continue;
  const c=r.canal||'nao-atribuido', cp=r.campanha||'(sem campanha)',
        cj=r.conjunto||'(sem conjunto)', an=r.anuncio||'(sem anúncio)';
  for(const k of [c, c+'|'+cp, c+'|'+cp+'|'+cj, c+'|'+cp+'|'+cj+'|'+an]){
   const o=SE[k]||(SE[k]={sessoes:0,nv:0}); o.sessoes+=(+r.sessoes||0); o.nv+=(+r.nv||0) }
 }
 // RECEITA QUE O META SE ATRIBUI, para a coluna de comparacao. Vem de vw_campanha_dia_real, grao de
 // conjunto — no anuncio fica em branco de proposito.
 const MP={};
 for(const r of (D.camp||[])){
  const d=String(r.dia).slice(0,10); if(!inP(d,jf2))continue;
  // 'meta' sozinho tambem: sem ele a coluna ficava vazia justo na linha do canal, que e onde a
  // comparacao com o nosso numero mais importa.
  for(const k of ['meta', 'meta|'+r.campanha, 'meta|'+r.campanha+'|'+r.conjunto]){
   const o=MP[k]||(MP[k]={rec:0,comp:0}); o.rec+=(+r.receita_plat||0); o.comp+=(+r.compras_plat||0) }
 }
 // OBJETIVO declarado no Meta (OUTCOME_SALES, OUTCOME_AWARENESS...), ja coletado.
 const OBJM={}; (D.metaobj||[]).forEach(r=>{
  OBJM['meta|'+r.campanha]=r.objetivo; OBJM['meta|'+r.campanha+'|'+r.conjunto]=r.objetivo });
 const ses=cam=>SE[cam.split('›').join('|')]||null;
 const mplat=cam=>MP[cam.split('›').join('|')]||null;
 const objm=cam=>OBJM[cam.split('›').join('|')]||null;
 const OBJN={OUTCOME_SALES:'Vendas',OUTCOME_ENGAGEMENT:'Engajamento',
             OUTCOME_AWARENESS:'Alcance',LINK_CLICKS:'Cliques',OUTCOME_TRAFFIC:'Tráfego'};
 // `cam` ja comeca pelo canal, entao a chave inteira casa com a do grid.
 const plt=(no,cam)=>no.lv===1?null:(PL[cam.split('›').join('|')]||null);
 const gst=(no,cam)=>{ if(no.lv===1)return GS[no.n]||0; const q=plt(no,cam); return q?q.spend:0 };
 const cst=(sp,n)=>(!sp||!n)?null:sp/n;
 // O CONJUNTO COMPLETO. A tela antiga de Midia tinha 23 colunas e a fusao tinha derrubado seis
 // (Conta, NC ROAS, NC PP, Cost ATC, CPV, OB CTR). Voltaram todas — mas as de negocio agora saem
 // da ATRIBUICAO, nao do grid: `conta` e a soma das 4 categorias da conta, `nc_*` sai de
 // novo_avulso + novo_assinatura. Cinza (p:1) = reportado pelo Meta, so existe la.
 const NC=a=>a.p_novo_avulso+a.p_novo_assinatura;
 const NCR=a=>a.r_novo_avulso+a.r_novo_assinatura;
 const NCM=a=>a.m_novo_avulso+a.m_novo_assinatura;
 // A CONTA em DOIS CORTES independentes, a pedido do Gabriel (10/08). Sao as mesmas 4 categorias
 // lidas por dois eixos, e cada par soma o mesmo total:
 //        NC + CA  =  CU + ASS  =  A CONTA
 //   quem comprou           |  o que comprou
 //   NC  novo_avulso + novo_assinatura        CU   novo_avulso + antigo_avulso

/* ==================== barra de filtros ==================== */
function filtros(){
 const PER=[['hoje','Hoje'],['ontem','Ontem'],['7','Últimos 7 dias'],['30','Últimos 30 dias'],
  ['mes','Este mês'],['mesant','Mês anterior'],['ano','Este ano'],['tudo','Todo o histórico'],['custom','📅 Escolher datas…']];
 const CMP=[['prev','Período anterior'],['mesant','Mesmo período do mês anterior'],
  ['anoant','Mesmo período do ano anterior'],['none','Sem comparação']];
 const MOD=[['sintese','Síntese'],['first','First click'],['last','Last click'],['plataforma','Plataformas']];
 document.getElementById('flz').innerHTML=`
  <div class="fg"><label>Balde</label><div class="chk">
   <button data-bal="" class="${S.bal===''?'on':''}" title="Amostra, compras e MRR somados">Tudo</button>
   ${Object.entries(BALDE).map(([k,v])=>`<button data-bal="${k}" class="${S.bal===k?'on':''}" title="${v.d}">${v.n}</button>`).join('')}
  </div></div>
  <div class="fg"><label for="fp">Período</label><select id="fp">${PER.map(([v,n])=>`<option value="${v}" ${S.per===v?'selected':''}>${n}</option>`).join('')}</select></div>
  ${S.per==='custom'?`<div class="fg"><label>De · até</label><div style="display:flex;gap:5px">
   <input type="date" id="d1" value="${S.d1||MIN}" min="${MIN}" max="${MAX}" aria-label="Data inicial">
   <input type="date" id="d2" value="${S.d2||MAX}" min="${MIN}" max="${MAX}" aria-label="Data final"></div></div>`:''}
  <div class="fg"><label for="fc">Comparar</label><select id="fc">${CMP.map(([v,n])=>`<option value="${v}" ${S.cmp===v?'selected':''}>${n}</option>`).join('')}</select></div>
  <div class="fg"><label for="fm">Atribuição</label><select id="fm">${MOD.map(([v,n])=>`<option value="${v}" ${S.mod===v?'selected':''}>${n}${v==='sintese'?' ★ recomendado':''}</option>`).join('')}</select></div>
  <div class="fg"><label for="fch">Canal</label><select id="fch"><option value="">Todos</option>${CANAIS.map(c=>`<option value="${c}" ${S.can===c?'selected':''}>${c}</option>`).join('')}</select></div>
  <button class="bt ${S.mais?'on':''}" id="bm">Mais filtros ${S.mais?'▲':'▼'}</button>
  <button class="bt" id="bc">Limpar filtros</button>
  <button class="bt" id="be">Exportar CSV</button>
  <button class="bt p" id="br" title="Recarrega os dados do snapshot">↻ Atualizar</button>`;
 const fx=document.getElementById('flx');
 fx.style.display=S.mais?'flex':'none';
 if(S.mais)fx.innerHTML=`
  <div class="fg"><label for="fcat">Tipo de cliente</label><select id="fcat"><option value="">Todos</option>
   ${ORD.map(c=>`<option value="${c}" ${S.cat===c?'selected':''}>${CAT[c].n}</option>`).join('')}</select></div>
  <div class="fg"><label for="fgr">Grupo de canal</label><select id="fgr"><option value="">Todos</option>
   ${[...new Set(Object.values(GRUPO))].sort().map(g=>`<option value="${g}" ${S.gru===g?'selected':''}>${g}</option>`).join('')}</select></div>
  <div class="fg"><label for="frec">Faturamento</label><select id="frec">
   <option value="liq" ${S.rec==='liq'?'selected':''}>Líquido</option>
   <option value="bruto" ${S.rec==='bruto'?'selected':''}>Bruto</option></select></div>
  <span style="font-size:11.5px;color:var(--t3)">Campanha, criativo, influenciador, nutricionista, evento, produto e oferta ficam sem opção: <b>não há dado</b> dessas dimensões hoje.</span>`;
 // Na Visão geral o PERÍODO se aplica (03/10); balde, comparar, atribuição, canal e afins não —
 // a definição das cinco linhas é fixa. Barra viva com corpo parado parecia dash travado,
 // então o que não responde fica desabilitado e esmaecido, com tooltip dizendo onde usar.
 if(S.pg==='visao'){
  const nota='Não se aplica na Visão geral — a definição é fixa. Use nas telas de investigação.';
  for(const sel of ['#fc','#fm','#fch','#fcat','#fgr','#frec','#bm'])
   document.querySelectorAll(sel).forEach(e=>{e.disabled=true;e.title=nota;
    const g=e.closest('.fg')||e; g.style.opacity=.45});
  document.querySelectorAll('.chk button').forEach(e=>{e.disabled=true;e.title=nota});
  const bal=document.querySelector('.chk'); if(bal&&bal.closest('.fg'))bal.closest('.fg').style.opacity=.45;
 }
}
function nav(){
 document.getElementById('nv').innerHTML=Object.entries(PGS).map(([k,v])=>
  `<button data-p="${k}" class="${S.pg===k?'on':''}" aria-current="${S.pg===k?'page':'false'}">
   <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="${v.ic}"/></svg>
   <span class="lb">${v.t}</span></button>`).join('');
 const tp=dias.reduce((a,r)=>a+r.pedidos,0);
 document.getElementById('ft').innerHTML=`Snapshot de ${DT(MAX)}<br>${IN(tp)} pedidos · ${IN(D.cbase.reduce((a,c)=>a+c.cli,0))} clientes<br><span style="color:var(--lj)">dado real de produção</span>`;

/* ==================== render ==================== */
function render(){
 document.getElementById('pt').textContent=PGS[S.pg].t;
 const j=jan(), jc=janC(j);
 // Na Visão geral a comparação não existe — o cabeçalho mostra só o período e a atualização.
 document.getElementById('up').textContent=S.pg==='visao'
  ?`${DT(j[0])} a ${DT(j[1])} · atualizado ${DT(MAX)}`
  :`${DT(j[0])} a ${DT(j[1])}${jc?` · comparando com ${DT(jc[0])} a ${DT(jc[1])}`:''} · atualizado ${DT(MAX)}`;
 filtros(); nav();
 const el=document.getElementById('pg');
 el.innerHTML=`<div class="gr g6">${'<div class="cd"><div class="sk" style="width:55%"></div><div class="sk" style="height:24px;margin-top:9px"></div></div>'.repeat(6)}</div>`;
 requestAnimationFrame(()=>{
  try{
   el.innerHTML = S.pg==='visao'?pgVisao():S.pg==='canais'?pgCanais():
    S.pg==='aquisicao'?pgAquisicao():S.pg==='amostras'?pgAmostras():
    S.pg==='base'?pgBase():S.pg==='jornada'?pgJornada():
    S.pg==='resultado'?pgResultado():
    S.pg==='definicoes'?pgDefinicoes():pgConfig();
  }catch(e){
   el.innerHTML=`<div class="al c"><div><b>Erro ao montar a página.</b><br>
    <span style="color:var(--t2)">${String(e.message||e)}</span><br>
    <button class="bt" onclick="location.reload()" style="margin-top:7px">Recarregar</button></div></div>`;
   console.error(e); return;
  }
  bind(el);
 });
}
function bind(el){
 el.querySelectorAll('th[data-k]').forEach(th=>{
  const go=()=>{const k=th.dataset.k,c=S.srt[S.pg];S.srt[S.pg]=(c&&c.k===k)?{k,d:-c.d}:{k,d:-1};render()};
  th.onclick=go; th.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go()}}});
 el.querySelectorAll('[data-oc]').forEach(b=>b.onclick=()=>{
  const k=b.dataset.oc; S.oc[S.pg]=S.oc[S.pg]||{}; S.oc[S.pg][k]=!S.oc[S.pg][k];
  try{localStorage.setItem('ca_cols',JSON.stringify(S.oc))}catch(e){} render()});
 el.querySelectorAll('[data-gran]').forEach(b=>b.onclick=()=>{S.gran=b.dataset.gran;render()});
 el.querySelectorAll('[data-cnivel]').forEach(b=>b.onclick=()=>{S.cnivel=b.dataset.cnivel;render()});
 el.querySelectorAll('[data-cab]').forEach(b=>b.onclick=()=>{S.cab=b.dataset.cab;render()});
 el.querySelectorAll('[data-rec]').forEach(b=>b.onclick=()=>{S.rec=b.dataset.rec;url();render()});
 el.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{S.pg=b.dataset.go;url();render()});
 el.querySelectorAll('[data-gtog]').forEach(b=>b.onclick=()=>{const k=decodeURIComponent(b.dataset.gtog);
   S.gop[k]?delete S.gop[k]:S.gop[k]=1; render()});
 el.querySelectorAll('[data-gper]').forEach(b=>b.onclick=()=>{S.gper=b.dataset.gper;S.gop={};render()});
 el.querySelectorAll('[data-gord]').forEach(b=>b.onclick=()=>{S.gord=b.dataset.gord;render()});
 el.querySelectorAll('[data-gcanal]').forEach(b=>b.onchange=()=>{S.gcanal=b.value;S.gop={};render()});
 el.querySelectorAll('[data-gbusca]').forEach(b=>b.onchange=()=>{S.gbusca=b.value;S.gop={};render()});
 const fi=el.querySelector('#fi'); if(fi)fi.onchange=()=>{S.ind=fi.value;render()};
 const dq=el.querySelector('#dq'); if(dq)dq.oninput=()=>{const v=dq.value.toLowerCase();
  el.querySelectorAll('#dl .df').forEach(d=>d.style.display=d.dataset.q.includes(v)?'':'none')};
 const bq=el.querySelector('#bq'); if(bq){bq.oninput=()=>{const v=bq.value.toLowerCase();
  el.querySelectorAll('tbody tr').forEach(tr=>{const t=tr.querySelector('td.fx');
   tr.style.display=(!t||t.textContent.toLowerCase().includes(v))?'':'none'})}}
}
const fech=()=>{document.getElementById('ov').classList.remove('on');document.getElementById('dw').classList.remove('on')};
/* ==================== eventos globais ==================== */
document.getElementById('nv').onclick=e=>{const b=e.target.closest('button[data-p]');
 if(b){S.pg=b.dataset.p;url();render();if(innerWidth<900)document.getElementById('sb').classList.remove('mb')}};
document.getElementById('tg').onclick=()=>document.getElementById('sb').classList.toggle(innerWidth<900?'mb':'col');
document.getElementById('flz').addEventListener('change',e=>{
 const m={fp:'per',fc:'cmp',fm:'mod',fch:'can',fe:'eixo',d1:'d1',d2:'d2'};
 if(m[e.target.id]){S[m[e.target.id]]=e.target.value;url();render()}});
document.getElementById('flx').addEventListener('change',e=>{
 const m={fcat:'cat',fgr:'gru',frec:'rec'};
 if(m[e.target.id]){S[m[e.target.id]]=e.target.value;url();render()}});
document.getElementById('flz').addEventListener('click',e=>{
 if(e.target.dataset&&e.target.dataset.bal!==undefined){S.bal=e.target.dataset.bal;S.cat='';url();render();return}
 if(e.target.id==='bm'){S.mais=!S.mais;render()}
 if(e.target.id==='bc'){Object.assign(S,{per:'30',cmp:'prev',mod:'sintese',can:'',cat:'',bal:'',gru:'',eixo:'pedido',rec:'liq',d1:'',d2:''});url();render()}
 if(e.target.id==='br'){render()}
 if(e.target.id==='be'){
  if(!CSV.length)return;
  const csv=CSV.map(r=>r.map(v=>{const s=v==null?'':String(v);
   return /[";\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(';')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}));
  a.download=`cells-analytics-${S.pg}-${MAX}.csv`; a.click(); URL.revokeObjectURL(a.href)}});
document.getElementById('ov').onclick=fech;
document.getElementById('dx').onclick=fech;
addEventListener('keydown',e=>{if(e.key==='Escape')fech()});
function url(){const p=new URLSearchParams();
 for(const k of ['pg','per','cmp','mod','can','cat','bal','gru','eixo','rec','d1','d2'])if(S[k])p.set(k,S[k]);
 history.replaceState(null,'','?'+p)}
(function init(){
 const p=new URLSearchParams(location.search);
 for(const k of ['pg','per','cmp','mod','can','cat','bal','gru','eixo','rec','d1','d2'])if(p.get(k))S[k]=p.get(k);
 if(!PGS[S.pg])S.pg='visao';
 try{const c=localStorage.getItem('ca_cols'); if(c)S.oc=JSON.parse(c)}catch(e){}
 render();
})();
</script>

<style>
#agq-btn{position:fixed;right:18px;bottom:18px;z-index:90;background:#111;color:#fff;border:none;border-radius:24px;

.agq-m{font-size:13px;line-height:1.55;padding:8px 11px;border-radius:8px;white-space:pre-wrap;max-width:92%}
.agq-u{background:#111;color:#fff;align-self:flex-end}
.agq-a{background:#F4F4F1;color:#111;align-self:flex-start}
.agq-e{background:#FBEBE9;color:#B3261E;align-self:flex-start;font-size:12px}

#agq button:disabled{opacity:.5;cursor:wait}
</style>
<button id="agq-btn" type="button">Perguntar aos dados</button>
<div id="agq" role="dialog" aria-label="Perguntar aos dados">
<header>pergunte à c<em>e</em>lls<small>ex.: "quanto vendeu o Meta essa semana?" · "como está o CAC?" · lê o Postgres ao vivo</small></header>
<div id="agq-log"></div>
<form id="agq-f"><input id="agq-i" placeholder="sua pergunta…" autocomplete="off" maxlength="500">
<button id="agq-s" type="submit">→</button></form>
</div>
<script>
(function(){
var hist=[], btn=document.getElementById('agq-btn'), box=document.getElementById('agq'),
    log=document.getElementById('agq-log'), f=document.getElementById('agq-f'),
    inp=document.getElementById('agq-i'), sb=document.getElementById('agq-s');
btn.onclick=function(){box.classList.toggle('open'); if(box.classList.contains('open'))inp.focus();};
function add(cls,txt){var d=document.createElement('div');d.className='agq-m '+cls;d.textContent=txt;
  log.appendChild(d);log.scrollTop=log.scrollHeight;return d;}
f.onsubmit=function(ev){ev.preventDefault();var q=inp.value.trim();if(!q||sb.disabled)return;
  inp.value='';add('agq-u',q);hist.push({role:'user',content:q});
  var w=add('agq-a','consultando o banco…');sb.disabled=true;
  fetch('/perguntar',{method:'POST',headers:{'content-type':'application/json'},
    body:JSON.stringify({mensagens:hist})})
  .then(function(r){return r.json();})
  .then(function(j){
    if(j.erro){w.className='agq-m agq-e';w.textContent=j.erro;}
    else{w.textContent=j.resposta;hist.push({role:'assistant',content:j.resposta});}
  })
  .catch(function(e){w.className='agq-m agq-e';w.textContent='falhou: '+e.message;})
  .finally(function(){sb.disabled=false;inp.focus();});
};
})();
</script>
